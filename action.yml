# creditia 的 GitHub Action：用仓库里公开的 credits.json（本机 creditia publish 写出）生成徽章、CREDITS.md 和一个署名小网站。
# CI 里没有任何人的 agent 日志，所以分析要在本机做；这里只负责把结果做成能看的东西。
# PR 评论和 Release 说明在没有 credits.json 时读提交上的盖章（本机提交盖章 hook 在提交时记下各工具写了几行），不用手动 publish。
name: creditia
description: 把 credits.json 做成徽章、CREDITS.md 和一个随提交更新的署名页
author: WroughtMind
branding:
  icon: award
  color: gray-dark
inputs:
  credits:
    description: 档案路径（creditia publish 写出的 credits.json）
    default: credits.json
  style:
    description: 风格（creditia export --list 查看）
    default: minimal
  badge:
    description: 徽章写到哪里（留空不生成），例如 assets/credits-badge.svg
    default: ''
  doc:
    description: CREDITS.md 写到哪里（留空不生成）
    default: ''
  site:
    description: 署名小网站写到哪个目录（留空不生成），配合 actions/upload-pages-artifact 发布到 GitHub Pages
    default: ''
  lang:
    description: zh 或 en
    default: zh
  group:
    description: 按工具（tool）还是按模型（model）分行；auto 在一个工具占九成以上、下面有几个模型时按模型
    default: auto
  release-notes:
    description: 发 Release 时（release published）把这一版的署名写进 Release 说明；再发一次只换掉上次写的那段
    default: 'false'
  pr-comment:
    description: PR 上评论这个 PR 的署名（按 PR 分支上的提交：先从 credits.json 里找，没有就读提交盖章），之后每次推送更新同一条评论
    default: 'false'
  token:
    description: 写 Release 说明、发 PR 评论用的 token（需要 contents 和 pull-requests 的写权限）
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: 安装渲染依赖
      shell: bash
      run: cd "$GITHUB_ACTION_PATH/packages/render" && npm ci --omit=dev --no-audit --no-fund
    - name: 生成
      shell: bash
      env:
        CT: node ${{ github.action_path }}/packages/cli/bin/creditia.mjs
        CREDITS: ${{ inputs.credits }}
        STYLE: ${{ inputs.style }}
        LANG_CT: ${{ inputs.lang }}
        GROUP: ${{ inputs.group }}
        BADGE: ${{ inputs.badge }}
        DOC: ${{ inputs.doc }}
        SITE: ${{ inputs.site }}
      run: |
        set -e
        if [ ! -f "$CREDITS" ]; then
          # 只写 PR 评论、Release 说明时不需要 credits.json（读提交盖章）
          if [ -z "$BADGE$DOC$SITE" ]; then exit 0; fi
          echo "::error::没有 $CREDITS。先在本机运行 creditia analyze && creditia publish，把 credits.json 提交进仓库。"; exit 1
        fi
        if [ -n "$BADGE" ]; then $CT export --credits "$CREDITS" --piece badge --style "$STYLE" --lang "$LANG_CT" --group "$GROUP" --format svg --out "$BADGE"; fi
        if [ -n "$DOC" ]; then $CT doc --credits "$CREDITS" --lang "$LANG_CT" --out "$DOC"; fi
        if [ -n "$SITE" ]; then $CT site --credits "$CREDITS" --style "$STYLE" --lang "$LANG_CT" --group "$GROUP" --out "$SITE"; fi
    - name: 跟着发版
      if: inputs.release-notes == 'true' || inputs.pr-comment == 'true'
      shell: bash
      env:
        CT: node ${{ github.action_path }}/packages/cli/bin/creditia.mjs
        CREDITS: ${{ inputs.credits }}
        LANG_CT: ${{ inputs.lang }}
        GROUP: ${{ inputs.group }}
        NOTES: ${{ inputs.release-notes }}
        PRC: ${{ inputs.pr-comment }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
        PR: ${{ github.event.pull_request.number }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -e
        say() { if [ "$LANG_CT" = en ]; then echo "$2"; else echo "$1"; fi; }
        O=(--credits "$CREDITS" --lang "$LANG_CT" --group "$GROUP")
        if [ "$EVENT" = release ] && [ "$NOTES" = true ] && [ -n "$TAG" ]; then
          gh release view "$TAG" --repo "$REPO" --json body -q .body > "$RUNNER_TEMP/notes.md"
          # credits.json 里有这个 tag 就用它；发版前 publish 的档案里这一版还叫 unreleased
          if $CT release-notes "$TAG" "${O[@]}" --into "$RUNNER_TEMP/notes.md" --out "$RUNNER_TEMP/new.md" 2>/dev/null \
            || $CT release-notes unreleased "${O[@]}" --into "$RUNNER_TEMP/notes.md" --out "$RUNNER_TEMP/new.md" 2>/dev/null; then
            gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/new.md" >/dev/null || say "::warning::creditia: 没能写入 Release 说明（token 需要 contents: write）" "::warning::creditia: couldn't update the release notes (the token needs contents: write)"
          else
            say "::notice::creditia: credits.json 里没有 $TAG 的署名，这一版的提交上也没有盖章。在本机打开提交盖章（creditia hook install），或者发版前 creditia publish 并提交。" "::notice::creditia: neither credits.json nor commit stamps say anything about $TAG. Turn on commit stamps locally (creditia hook install), or run creditia publish and commit before releasing."
          fi
        fi
        if [ "$EVENT" = pull_request ] && [ "$PRC" = true ] && [ -n "$PR" ]; then
          shas=$(git log --format=%H "$BASE..$HEAD_SHA" 2>/dev/null | tr '\n' ',')
          [ -n "$shas" ] || { say "::notice::creditia: 拿不到 PR 的提交（actions/checkout 需要 fetch-depth: 0）" "::notice::creditia: couldn't list the PR's commits (actions/checkout needs fetch-depth: 0)"; exit 0; }
          if $CT pr-comment --commits "$shas" "${O[@]}" --out "$RUNNER_TEMP/pr.md" 2>/dev/null; then
            body="<!-- creditia:pr -->
        $(cat "$RUNNER_TEMP/pr.md")"
            id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- creditia:pr -->")) | .id' | head -1)
            if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null; else gh pr comment "$PR" --repo "$REPO" --body "$body" >/dev/null; fi \
              || say "::warning::creditia: 没能发 PR 评论（token 需要 pull-requests: write；来自 fork 的 PR 拿不到写权限）" "::warning::creditia: couldn't comment on the PR (the token needs pull-requests: write; PRs from forks don't get it)"
          else
            say "::notice::creditia: 这个 PR 的提交既不在 credits.json 里，也没有盖章。在本机打开提交盖章（creditia hook install）后提交的会自动带上。" "::notice::creditia: this PR's commits are neither in credits.json nor stamped. Turn on commit stamps locally (creditia hook install) and new commits carry them automatically."
          fi
        fi

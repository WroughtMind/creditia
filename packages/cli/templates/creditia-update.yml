# 放到你仓库的 .github/workflows/creditia.yml：每次推到 main 时更新 CREDITS.md 和徽章。
# CI 上没有本机 agent 日志，归因只靠 git 信号和提交里的 Creditia-* 盖章 trailer；
# 想带上本机证据，可先在本机 `creditia evidence export`，把文件提交到仓库，再在这里 `creditia evidence import`。
name: creditia

on:
  push:
    branches: [main]

jobs:
  credits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g creditia
      - name: 分析
        run: creditia update --json
      - name: 档案与徽章
        run: |
          creditia doc
          mkdir -p assets
          creditia export --form badge --format svg --out assets/creditia-badge.svg
      - name: 提交回仓库
        run: |
          git config user.name "creditia"
          git config user.email "creditia@users.noreply.github.com"
          git add CREDITS.md .creditia/credits.json assets/creditia-badge.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update credits"
            git push
          fi

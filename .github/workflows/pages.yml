# 官网：每次推到 main 重新生成作品、交互演示和 creditia 自己的署名页，发布到 GitHub Pages。
name: pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install fonttools brotli pillow
      - run: npm ci --no-audit --no-fund
        working-directory: packages/render
      # 首页的交互演示使用 catnap 样例档案。
      - run: npm ci --no-audit --no-fund
        working-directory: site/app
      - name: App 字体子集
        run: npm run fonts
        working-directory: site/app
      - name: 生成官网（首页 + creditia 自己的署名页）
        run: node site/build.ts _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

# CI：Rust 核心与渲染在 Linux 上测；App 在 macOS 上实际编译、打包成 .app（未签名），作为产物上传，再跑 App 自己的 clippy 和单测
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  command-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify helper jobs stop on completion, timeout and core cancellation
        run: cargo test -p creditia-adapters command:: --lib

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: packages/render
      - run: node --test packaging/*.test.mjs site/*.test.mjs
      - run: npm test
        working-directory: packages/render
      - run: node --test test/*.test.ts
        working-directory: packages/cli
      - name: Install CLI build dependencies
        run: npm ci
        working-directory: packages/cli
      - name: Verify the actual npm tarball outside the repository
        shell: bash
        run: |
          cd packages/cli
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm install --prefix creditia-package-smoke ./creditia-*.tgz --no-audit --no-fund
          cd creditia-package-smoke
          node_modules/.bin/creditia --help
          node_modules/.bin/creditia doc --credits "$GITHUB_WORKSPACE/packages/render/fixtures/catnap.json" --out CREDITS.md
          node_modules/.bin/creditia export --credits "$GITHUB_WORKSPACE/packages/render/fixtures/catnap.json" --piece tier --style ink --format png --out tier.png

  desktop-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with Icon Composer support
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install fonttools brotli
      - run: npm ci
        working-directory: packages/render
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - name: 字体子集
        run: npm run fonts
        working-directory: apps/desktop
      - name: 分析核心（随 App 一起打包）
        run: npm run core
        working-directory: apps/desktop
      - name: 编译并打包 App
        run: npm run tauri -- build --bundles app --verbose
        working-directory: apps/desktop
      - name: 验证分层图标及三种外观
        run: node apps/desktop/tools/verify-macos-icon.mjs apps/desktop/src-tauri/target/release/bundle/macos/creditia.app
      # 放在打包之后：要用上一步 vite 编出来的 dist（App 把它编进二进制）
      - name: App 的 Rust：clippy 与单测
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
        working-directory: apps/desktop/src-tauri
      - name: 打成 zip
        run: ditto -c -k --keepParent apps/desktop/src-tauri/target/release/bundle/macos/creditia.app creditia-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: creditia-macos
          path: creditia-macos.zip

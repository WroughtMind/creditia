name: Profile the installed high-DPI renderer
on:
  push:
    branches: [codex/gpui-installer-check]
permissions: { contents: read, actions: read }
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install Pillow==11.3.0
      - run: bash packaging/gpui/linux-libs.sh build
      - uses: actions/download-artifact@v4
        with:
          name: gpui-candidate-x86_64-unknown-linux-gnu
          path: installers
          run-id: 42264578175
          github-token: ${{ github.token }}
      - name: Profile a disposable copy of the renderer
        run: |
          tar xf installers/*.tar.gz
          pkg=creditia-gpui-x86_64-unknown-linux-gnu
          mkdir -p evidence/bridge
          export CREDITIA_PROFILE_DIR="$PWD/evidence/bridge"
          python /dev/stdin <<'PY'
          from pathlib import Path
          f=Path('creditia-gpui-x86_64-unknown-linux-gnu/resources/render/tools/bridge.mjs')
          s=f.read_text().replace("import { once }", "import fs from 'node:fs';\nimport crypto from 'node:crypto';\nimport { once }")
          s=s.replace("    await send(await session.dispatch(request));", """    const start=Date.now(), response=await session.dispatch(request);
              if (request.t !== undefined && response.result?.art?.svg) {
                const svg=response.result.art.svg, digest=crypto.createHash('sha256').update(svg).digest('hex');
                fs.appendFileSync(process.env.CREDITIA_PROFILE_DIR+'/frames.jsonl',JSON.stringify({start,end:Date.now(),time:request.t,digest,bytes:svg.length})+'\\n');
                const path=process.env.CREDITIA_PROFILE_DIR+'/frame-'+Math.round(request.t*90)+'.svg';
                if(!fs.existsSync(path))fs.writeFileSync(path,svg);
              }
              await send(response);""")
          assert "frames.jsonl" in s
          f.write_text(s)
          PY
          python packaging/gpui/animation-smoke.py --binary "$pkg/creditia-gpui" --archive packages/render/fixtures/catnap.json --output evidence/player --candidate "$(node -p 'require("./installers/candidate.json").candidate_sha')"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: high-dpi-profile, path: evidence }

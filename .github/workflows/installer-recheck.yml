name: Recheck sealed GPUI installers
on:
  push:
    branches: [codex/gpui-installer-check]
permissions: { contents: read, actions: read }
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install Pillow==11.3.0
      - if: runner.os == 'Linux'
        run: bash packaging/gpui/linux-libs.sh build
      - uses: actions/download-artifact@v4
        with:
          name: gpui-candidate-${{ matrix.target }}
          path: installers
          run-id: 42264578175
          github-token: ${{ github.token }}
      - run: node packaging/gpui/install-smoke.mjs --installers installers --fixture packages/render/fixtures/catnap.json --output evidence/installed/manifest.json
      - if: always() && runner.os == 'Linux'
        run: |
          tar xf installers/*.tar.gz
          python packaging/gpui/animation-smoke.py --binary creditia-gpui-x86_64-unknown-linux-gnu/creditia-gpui --archive packages/render/fixtures/catnap.json --output evidence/animation --candidate "$(node -p 'require("./installers/candidate.json").candidate_sha')"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-recheck-${{ matrix.target }}
          path: evidence

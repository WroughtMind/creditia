# 发版：打 v* 标签时，为各平台编译分析核心，挂到 GitHub Release 上（npx creditia 第一次用到分析时会下载它）
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  core:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p creditia-cli --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/creditia-core${{ matrix.ext }} creditia-core-${{ matrix.target }}${{ matrix.ext }}
      - uses: softprops/action-gh-release@v2
        with:
          files: creditia-core-${{ matrix.target }}${{ matrix.ext }}

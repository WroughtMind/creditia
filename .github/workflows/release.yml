# The desktop payload is promoted from the reviewed GPUI release, byte for byte.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  cores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: node packaging/release.mjs check
      - run: cargo build --locked --release --target ${{ matrix.target }} -p creditia-cli
      - name: Exercise the standalone analysis core
        shell: bash
        env: { TARGET: '${{ matrix.target }}' }
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ext=''; if [[ "$TARGET" == *windows* ]]; then ext='.exe'; fi
          binary="release-assets/creditia-core-$TARGET$ext"
          cp "target/$TARGET/release/creditia-core$ext" "$binary"
          if [[ "$RUNNER_OS" == macOS ]]; then codesign --force --sign - "$binary"; codesign --verify --strict "$binary"; fi
          "$binary" help
          node packaging/acceptance.mjs analyze "$binary" evidence
      - uses: actions/upload-artifact@v4
        with: { name: 'core-${{ matrix.target }}', path: 'release-assets/*', if-no-files-found: error }
  assemble:
    needs: cores
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'core-*', merge-multiple: true, path: release-assets }
      - name: Copy the exact desktop assets from the tested release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node packaging/promote-desktop.mjs release-assets
      - run: node packaging/release.mjs assemble release-assets
      - run: node packaging/acceptance.mjs verify release-assets
      - uses: actions/upload-artifact@v4
        with: { name: release-candidate, path: 'release-assets/*', if-no-files-found: error }
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with: { draft: true, fail_on_unmatched_files: true, files: 'release-assets/*' }

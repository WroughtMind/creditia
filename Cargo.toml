[workspace]
resolver = "2"
members = ["crates/core", "crates/adapters", "crates/store", "crates/cli", "crates/desktop-service"]
# GPUI 使用独立的工作区，核心可以单独编译。
exclude = ["spike", "apps/gpui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/WroughtMind/creditia"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
zstd = "0.13"
base64 = "0.22"
walkdir = "2.5"
regex = "1"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 4

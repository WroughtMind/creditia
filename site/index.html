<style>

  --card: #141413; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 30px 70px -28px rgba(0,0,0,.9);

}
* { box-sizing: border-box; }

.wrap { width: min(1120px, 100% - 64px); margin: 0 auto; }

/* ───────── 顶栏 ───────── */
header { position: fixed; inset: 0 0 auto; z-index: 40; color: var(--hero-ink); transition: transform .45s cubic-bezier(.2,.8,.2,1), background-color .3s, color .3s, box-shadow .3s; }
header.solid { color: var(--ink); background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 1px 0 var(--line); }
header.away { transform: translateY(-100%); }
header .wrap { height: 64px; display: flex; align-items: center; gap: 12px; }
nav { display: flex; gap: 2px; margin-left: 28px; position: relative; }
nav a { position: relative; z-index: 1; padding: 6px 12px; border-radius: 99px; font-size: 13.5px; text-decoration: none; opacity: .66; transition: opacity .2s; }
nav a:hover, nav a.on { opacity: 1; }
nav .pill { position: absolute; z-index: 0; top: 0; height: 100%; border-radius: 99px; background: var(--line2); box-shadow: inset 0 0 0 1px var(--line); opacity: 0; transition: left .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1), opacity .3s; }
header:not(.solid) nav .pill { background: var(--hero-line); box-shadow: none; }
.get { height: 32px; padding: 0 14px; border-radius: 99px; font: 500 13px/1 Inter, sans-serif; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; background: currentColor; margin-left: 6px; }
.get span { color: var(--bg); }
header:not(.solid) .get span { color: var(--hero); }
.get svg { width: 13px; height: 13px; fill: var(--bg); }
header:not(.solid) .get svg { fill: var(--hero); }
section, #screen { scroll-margin-top: 64px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; text-decoration: none; }
.brand svg { width: 19px; height: 19px; }
.grow { flex: 1; }
.ctl { display: flex; gap: 2px; }
.ctl button, .ctl a { height: 32px; min-width: 32px; padding: 0 9px; border-radius: 99px; border: 0; background: transparent; opacity: .72; font: 500 12.5px/1 Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.ctl button:hover, .ctl a:hover { opacity: 1; background: var(--hero-line); }
.ctl svg { width: 16px; height: 16px; }
#theme .sun { display: none; }
:root[data-theme="dark"] #theme .sun { display: block; }
:root[data-theme="dark"] #theme .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #theme .sun { display: block; } :root:not([data-theme="light"]) #theme .moon { display: none; } }

/* ───────── 首屏 ───────── */
#screen { position: relative; height: 100vh; height: 100svh; min-height: 660px; max-height: 1100px; overflow: hidden; background: var(--hero); color: var(--hero-ink); transition: background-color .3s, color .3s; }
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 130%; }
/* 首屏右边：一个编辑器，代码一行行写出来，每行左边标上是哪个 AI 写的，底下的占比跟着涨 */
@property --glow { syntax: '<color>'; inherits: true; initial-value: rgba(0,0,0,0); }
.stage { position: absolute; z-index: 1; top: 84px; bottom: 36px; right: max(32px, calc((100vw - 1120px) / 2)); width: min(540px, 45vw); display: grid; place-items: center; perspective: 1600px; translate: 0 calc(var(--py, 0px) * -0.35); }
.stage::before { content: ""; position: absolute; inset: -6% -24% -6% -14%; pointer-events: none; background: radial-gradient(46% 42% at 52% 46%, color-mix(in srgb, var(--glow) 34%, transparent), transparent 72%); transition: --glow 1.4s ease; }
.ed { --ed-bg: #FFFFFF; --ed-line: rgba(22,21,18,.09); --ed-soft: #8D887E; --ed-faint: #C9C4BA; --ed-hl: rgba(22,21,18,.035); --ed-str: #8A6A35; --ed-kw: #7A6F9E;
  position: relative; flex: none; width: 540px; border-radius: 14px; font-variant-ligatures: none; background: var(--ed-bg); border: 1px solid var(--ed-line); overflow: hidden; font-size: 12.5px;
  box-shadow: 0 1px 1px rgba(22,21,18,.04), 0 50px 110px -48px rgba(40,30,20,.45); transform: scale(var(--k, 1)) rotateX(var(--tx, 0deg)) rotateY(var(--ty, 0deg)); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
:root[data-theme="dark"] .ed { --tint: .1; --ed-bg: #0F0F10; --ed-line: rgba(241,234,220,.08); --ed-soft: #7F7A70; --ed-faint: #46433E; --ed-hl: rgba(241,234,220,.035); --ed-str: #C8AE7E; --ed-kw: #A69AD0; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 50px 120px -40px rgba(0,0,0,.9); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ed { --tint: .1; --ed-bg: #0F0F10; --ed-line: rgba(241,234,220,.08); --ed-soft: #7F7A70; --ed-faint: #46433E; --ed-hl: rgba(241,234,220,.035); --ed-str: #C8AE7E; --ed-kw: #A69AD0; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 50px 120px -40px rgba(0,0,0,.9); } }
.ed-tabs { position: relative; height: 40px; display: flex; align-items: stretch; padding: 0 8px; border-bottom: 1px solid var(--ed-line); font: 11.5px "JetBrains Mono", monospace; color: var(--ed-soft); }
.ed-tabs span { display: flex; align-items: center; gap: 7px; padding: 0 12px; transition: color .4s; white-space: nowrap; }
.ed-tabs span i { width: 6px; height: 6px; border-radius: 2px; background: var(--ed-faint); transition: background-color .4s; }
.ed-tabs span.on { color: var(--hero-ink); }
.ed-tabs span.on i { background: var(--glow); }
.ed-tabs b { position: absolute; bottom: -1px; height: 1.5px; background: var(--hero-ink); transition: left .55s cubic-bezier(.2,.8,.2,1), width .55s cubic-bezier(.2,.8,.2,1); }
.ed-code { position: relative; padding: 12px 0; height: calc(19 * 22px + 24px); font-family: "JetBrains Mono", ui-monospace, monospace; }
.r { position: relative; display: grid; grid-template-columns: 38px 3px 1fr; align-items: center; height: 22px; white-space: pre; color: var(--hero-ink); }
.r::before { content: ""; position: absolute; inset: 0; background: var(--ed-hl); opacity: 0; transition: opacity .25s; }
.r.cur::before { opacity: 1; }
.r::after { content: ""; position: absolute; inset: 0 0 0 41px; background: linear-gradient(90deg, var(--c), transparent 85%); opacity: 0; transition: opacity .6s; pointer-events: none; }
.r.done::after { opacity: var(--tint, .07); }
.r .n { text-align: right; padding-right: 12px; font-size: 10.5px; color: var(--ed-faint); }
.r .s { align-self: stretch; background: var(--c); transform: scaleY(0); transform-origin: top; transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
.r .s.none { background: repeating-linear-gradient(180deg, var(--ed-soft) 0 3px, transparent 3px 6px); opacity: .6; }
.r.done .s { transform: none; }
.r .x { padding-left: 14px; overflow: hidden; }
.r .w { position: absolute; right: 14px; top: 0; height: 22px; display: flex; align-items: center; gap: 6px; font: 500 11px Inter, sans-serif; color: var(--c); opacity: 0; transform: translateX(8px); transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); }
.r .w.none { color: var(--ed-soft); }
.r .w svg { width: 12px; height: 12px; fill: currentColor; }
.r .w.none svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 3 3; }
.r .w.on { opacity: 1; transform: none; }
.r .k { color: var(--ed-kw); } .r .q { color: var(--ed-str); } .r .m { color: var(--ed-soft); font-style: italic; }
.r .cr { display: inline-block; width: 7px; height: 15px; vertical-align: -3px; background: var(--glow); margin-left: 1px; }
.ed-foot { border-top: 1px solid var(--ed-line); padding: 14px 16px 16px; }
.ed-cap { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--ed-soft); margin-bottom: 10px; }
.ed-cap b { font-weight: 500; color: var(--hero-ink); }
.ed-bar { display: flex; gap: 2px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--ed-hl); }
.ed-bar i { display: block; height: 100%; background: var(--c); transition: flex-basis .45s cubic-bezier(.2,.8,.2,1); flex: 0 0 0%; }
.ed-bar i.none { background: repeating-linear-gradient(135deg, var(--ed-soft) 0 2px, transparent 2px 4px); }
.ed-chips { margin-top: 11px; display: flex; gap: 16px; font: 11.5px "JetBrains Mono", monospace; color: var(--ed-soft); font-variant-numeric: tabular-nums; }
.ed-chips span { display: inline-flex; align-items: center; gap: 6px; transition: color .3s; }
.ed-chips span.hot { color: var(--hero-ink); }
.ed-chips svg { width: 12px; height: 12px; fill: var(--c); }
.ed-chips .none svg { fill: none; stroke: var(--ed-soft); stroke-dasharray: 2 2; }
.title { translate: 0 var(--py, 0px); opacity: var(--po, 1); }
.title { position: absolute; z-index: 2; left: max(32px, calc((100vw - 1120px) / 2)); top: 50%; transform: translateY(-48%); width: min(520px, 46vw); }
.title h1 { font-size: clamp(48px, 6vw, 84px); line-height: 1; }
:lang(zh) .title h1 { font-size: clamp(40px, 4.6vw, 64px); line-height: 1.24; }
.title p { margin: 26px 0 0; font-size: 17px; line-height: 1.75; color: var(--hero-soft); max-width: 27em; text-wrap: pretty; }
.cmd { margin-top: 32px; display: inline-flex; align-items: center; gap: 14px; height: 46px; padding: 0 6px 0 16px; border-radius: 10px; border: 1px solid var(--hero-line); font-size: 14.5px; }
.cmd .p { color: var(--hero-soft); margin-right: 8px; }
.acts { margin-top: 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.acts .cmd { margin-top: 0; }
.dl { height: 46px; padding: 0 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 9px; text-decoration: none; background: var(--hero-ink); color: var(--hero); font-weight: 500; font-size: 14.5px; transition: transform .2s, box-shadow .2s; }
.dl:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -12px var(--hero-ink); }
.dl svg { width: 16px; height: 16px; fill: currentColor; }
.cmd button { height: 34px; width: 34px; border-radius: 7px; border: 0; background: transparent; color: var(--hero-soft); cursor: pointer; display: grid; place-items: center; }
.cmd button:hover { background: var(--hero-line); color: var(--hero-ink); }
.cmd button svg { width: 16px; height: 16px; }
.agents { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 14px 16px; color: var(--hero-soft); max-width: 470px; }
.agents span { display: inline-flex; position: relative; transition: translate .5s cubic-bezier(.2,.8,.2,1); }
.agents svg { width: 24px; height: 24px; fill: currentColor; display: block; transition: color .15s; }
.agents span:hover { color: var(--hero-ink); }
.agents span::after { content: attr(data-n); position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--hero-ink); opacity: 0; pointer-events: none; transition: opacity .15s; }
.agents span:hover::after { opacity: 1; }

/* ───────── 风格墙：三条带子，图块大小不一；可以拖，悬停会停 ───────── */
.wall { margin-top: 48px; display: grid; gap: 14px; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; padding: 14px 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.wall.drag { cursor: grabbing; }
.band { display: flex; gap: 14px; width: max-content; will-change: transform; }
.col { display: flex; flex-direction: column; flex: none; }
.tile { position: relative; display: block; width: 100%; flex: none; padding: 0; border: 0; background: var(--line2); border-radius: 4px; overflow: hidden; cursor: inherit; box-shadow: var(--shadow);
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1)); transition: transform .6s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
.tile.hot { transition: transform .15s ease-out; z-index: 2; }
.tile > img, .tile .roller img { width: 100%; height: 100%; object-fit: cover; object-position: top; -webkit-user-drag: none; pointer-events: none; }
.tile::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.28), transparent 50%); mix-blend-mode: overlay; }
.tile.hot::after { opacity: 1; }
.tile .lab { position: absolute; z-index: 3; left: 8px; bottom: 8px; padding: 3px 9px; border-radius: 99px; font-size: 12px; line-height: 1.5; background: rgba(12,12,11,.78); color: #EEE9DF; opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; white-space: nowrap; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tile.hot .lab, .tile:focus-visible .lab, .tile.morph .lab { opacity: 1; transform: none; }
.live .roller { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.live .roller img { height: auto; }
.morph > img { position: absolute; inset: 0; }
.morph > img.on { z-index: 1; }
/* 放大看 */
#lb { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,8,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; grid-template-rows: 1fr auto; padding: 4vh 4vw 3vh; color: #EEE9DF; }
#lb .big { display: grid; place-items: center; min-height: 0; }
#lb.tall .big { overflow-y: auto; place-items: start center; overscroll-behavior: contain; }
#lb.tall .big img { max-height: none; width: min(560px, 92vw); }
#lb .big img { max-height: calc(100vh - 8vh - 90px); max-width: 92vw; width: auto; height: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
#lb .bar { display: flex; align-items: center; gap: 18px; justify-content: center; padding-top: 18px; font-size: 14.5px; }
#lb .bar b { font-weight: 600; }
#lb .bar span { color: #A8A296; }
#lb button { height: 38px; min-width: 38px; border-radius: 99px; border: 1px solid rgba(238,233,223,.2); background: transparent; color: #EEE9DF; cursor: pointer; font-size: 16px; }
#lb button:hover { background: rgba(238,233,223,.1); }
#lb .x { position: absolute; top: 18px; right: 18px; }

/* ───────── 一行一行 ───────── */
.legend { margin-top: 36px; display: flex; gap: 8px; flex-wrap: wrap; }
.legend span { user-select: none; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); font-size: 14px; color: var(--soft); transition: background-color .15s, color .15s; }
.legend span:hover, .legend span.on { background: var(--line2); color: var(--ink); }
.legend i { width: 11px; height: 11px; border-radius: 3px; }
.sw-verified { background: var(--c-verified); }
.sw-declared { background: var(--c-declared); }
.sw-inferred { background: repeating-linear-gradient(45deg, var(--c-inferred) 0 2px, transparent 2px 4px); outline: 1px solid var(--c-inferred); }
.sw-unknown { outline: 1px dashed var(--faint); }
.editor { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
.code { padding: 14px 0 16px; font-size: 13.5px; line-height: 1.95; overflow-x: auto; }
.ln { display: grid; grid-template-columns: 46px 4px 1fr auto; align-items: center; transition: opacity .2s; padding-right: 16px; min-width: 680px; }
.ln .no { text-align: right; padding-right: 14px; color: var(--faint); font-size: 12px; }
.ln .mark { align-self: stretch; }
.ln .tx { padding-left: 18px; white-space: pre; }
.ln .who { font: 12.5px Inter, sans-serif; color: var(--soft); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.ln:hover .who, .ln.lit .who { opacity: 1; }
.code.focus .ln:not(.lit) { opacity: .25; }
.m-verified { background: var(--c-verified); }
.m-declared { background: var(--c-declared); }
.m-inferred { background: repeating-linear-gradient(180deg, var(--c-inferred) 0 3px, transparent 3px 6px); }
.m-unknown { background: repeating-linear-gradient(180deg, var(--faint) 0 2px, transparent 2px 6px); opacity: .7; }
.tok-k { color: var(--soft); }
.tok-c { color: var(--faint); font-style: italic; }

/* ───────── 用法：四张卡都是会自己演的小样，高度固定，内容在里面滚，不把页面撑开 ───────── */
.ways { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.way { border: 1px solid var(--line); border-radius: 16px; background: var(--card); padding: 18px 22px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; min-width: 0; }
.way h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; min-height: 28px; }
.way h3 small { font-weight: 400; color: var(--faint); font-size: 13px; }
.again { margin-left: auto; width: 28px; height: 28px; border-radius: 99px; border: 0; background: transparent; color: var(--faint); cursor: pointer; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s, color .15s, background-color .15s; }
.again.on { opacity: 1; pointer-events: auto; }
.again:hover { color: var(--ink); background: var(--line2); }

<script>
/*__DATA__*/
const EN = {
  'hero.t': 'Which AI<br>wrote your code',
  'hero.p': 'creditia matches your agents’ logs against git history line by line, works out what each tool and each model wrote, and rolls it as end credits. Runs locally.',
  'looks.t': 'Same credits, twenty-six looks',
  'lines.t': 'Every line has a source', 'lines.p': 'What can’t be matched is marked unattributed. Runs locally, calls no model.',
  'use.t': 'Four ways to use it', 'w.cli': 'Command line', 'w.agent': 'Your agent',
  'foot.rules': 'Attribution rules',
  'nav.looks': 'Looks', 'nav.lines': 'Sources', 'nav.use': 'Usage', 'nav.get': 'Install', 'ins.t': 'Install',
};
const ZH = {};
document.querySelectorAll('[data-i]').forEach((el) => (ZH[el.dataset.i] = el.innerHTML));
const lang = () => (document.documentElement.lang === 'en' ? 'en' : 'zh');
const t = (k) => (lang() === 'en' ? EN[k] : ZH[k]) ?? k;
const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
const sname = (s) => (lang() === 'en' ? s.en : s.name);
const size = (img, d) => { img.width = d.w; img.height = d.h; };

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
const $ = (id) => document.getElementById(id);
const EASE = 'cubic-bezier(.2,.75,.15,1)';
const SPRING = 'cubic-bezier(.34,1.5,.5,1)';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// 一个 rAF 循环带所有会动的东西；页面不可见时浏览器自己会停
const tickers = new Set();
let lastT = 0;
requestAnimationFrame(function loop(now) {
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  tickers.forEach((f) => f(dt, now));
  requestAnimationFrame(loop);
});
// 滚动速度（平滑过）：首屏字幕、风格墙都跟着它加速
let sv = 0, lastY = scrollY;
tickers.add((dt) => { const v = dt ? (scrollY - lastY) / dt : 0; lastY = scrollY; sv += (v - sv) * Math.min(1, dt * 5); });

/** 把元素里的文字拆成一个个可以单独动的块：中文按字，英文按词 */
function split(el) {
  const zh = lang() === 'zh', out = [];
  const walk = (node) => [...node.childNodes].forEach((n) => {
    if (n.nodeType === 3) {
      const f = document.createDocumentFragment();
      (zh ? [...n.textContent] : n.textContent.split(/(\s+)/)).forEach((p) => {
        if (!p) return;
        if (/^\s+$/.test(p)) return f.append(p);
        const o = document.createElement('span'), i = document.createElement('span');
        o.className = 'sl'; i.className = 'sc'; i.textContent = p; o.append(i); f.append(o); out.push(i);
      });
      n.replaceWith(f);
    } else if (n.nodeType === 1 && n.tagName !== 'BR') walk(n);
  });
  walk(el);
  return out;
}
const rise = (els, o = {}) => els.forEach((e, k) => e.animate(
  [{ transform: `translateY(${o.y ?? 105}%)`, opacity: 0, filter: o.blur ? 'blur(8px)' : 'none' }, { transform: 'none', opacity: 1, filter: 'none' }],
  { duration: o.dur ?? 900, delay: (o.delay ?? 0) + k * (o.step ?? 30), easing: EASE, fill: 'backwards' }));
function count(el, to, fmt, dur = 1000) {
  if (RM) return (el.textContent = fmt(to));
  const t0 = performance.now();
  requestAnimationFrame(function f(now) { const p = Math.min(1, (now - t0) / dur); el.textContent = fmt(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); });
}

// ───────── 首屏 ─────────
$('agents').innerHTML = DATA.tools.map((x) => `<span data-n="${x.name}" aria-label="${x.name}">${x.svg}</span>`).join('');
// 首屏：编辑器里代码一行行写出来，每写完一行就标上是哪个 AI 写的；底下按行数算占比，
// 三个文件写完，换成整个仓库的数字。鼠标放上去就停住
const AGC = { 'claude-code': '#D97757', codex: '#4FA37F', cursor: '#7D8AE0', kimi: '#C59A4C', grok: '#9C978D', unattributed: '' };
const NM = { c: 'claude-code', x: 'codex', u: 'cursor', k: 'kimi', g: 'grok', n: 'unattributed' };
const FILES = [
  ['src/sync/queue.ts', `c|import { db } from '../db'
c|import type { Op } from './types'
c|
c|export class SyncQueue {
c|  private pending: Op[] = []
c|  private timer?: number
c|
x|  push(op: Op) {
x|    this.pending.push(op)
x|    this.timer ??= setTimeout(
x|      () => this.flush(), 400)
x|  }
c|
c|  async flush() {
c|    const ops = this.pending.splice(0)
c|    await db.ops.bulkPut(ops)
c|    this.timer = undefined
c|  }
c|}`],
  ['src/ui/Timeline.tsx', `u|import { useMemo } from 'react'
u|import { groupByDay } from '../lib/time'
u|
c|export function Timeline({ notes }) {
c|  const days = useMemo(
c|    () => groupByDay(notes), [notes])
c|  return (
x|    <ol className="timeline">
x|      {days.map((d) => (
x|        <Day key={d.date} {...d} />
x|      ))}
x|    </ol>
c|  )
c|}`],
  ['src/lib/search.ts', `k|import MiniSearch from 'minisearch'
c|
c|const index = new MiniSearch({
c|  fields: ['title', 'body'],
c|  storeFields: ['title'],
x|})
x|
g|export const search = (q: string) =>
c|  index.search(q, { prefix: true })
c|
n|// TODO: fuzzy match for CJK
c|export function reindex(notes) {
c|  index.removeAll()
c|  index.addAll(notes)
c|}`],
].map(([name, src]) => ({ name, lines: src.split('\n').map((l) => ({ who: NM[l[0]], tx: l.slice(2) })) }));
const logoOf = (key) => (key === 'unattributed' ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>' : DATA.tools.find((x) => x.name === (DATA.share.zh.find((r) => r.key === key) || {}).name)?.svg || '');
const agName = (key) => (DATA.share[lang()].find((r) => r.key === key) || {}).name || key;
const KW = /(\/\/.*$)|('[^']*'?)|\b(import|from|export|const|class|private|async|await|function|return|type|new)\b|[&<>]/g;
const synt = (s) => s.replace(KW, (m, c, q, k) => (c ? `<span class="m">${esc(c)}</span>` : q ? `<span class="q">${esc(q)}</span>` : k ? `<span class="k">${k}</span>` : m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'));
const hero = { gen: 0, hover: false, counts: {}, total: 0, key: '' };
const until = async (f) => { while (!f()) await sleep(120); };
const heroLive = () => !hero.hover && scrollY < innerHeight && !document.hidden;
function heroTally(final) {
  const rows = DATA.share[lang()];
  const pct = (k) => (final ? rows.find((r) => r.key === k).pct : hero.total ? (100 * (hero.counts[k] || 0)) / hero.total : 0);
  [...$('edbar').children].forEach((i) => (i.style.flexBasis = `${pct(i.dataset.k)}%`));
  [...$('edchips').children].forEach((c) => { c.querySelector('b').textContent = `${pct(c.dataset.k).toFixed(1)}%`; });
  const en = lang() === 'en';
  $('edl').innerHTML = final ? `<b>lumen</b> · ${en ? 'whole repo' : '整个仓库'}` : `<b>${hero.total}</b> ${en ? 'lines' : '行'}`;
  $('edr').textContent = final ? (en ? '612 commits · 49,360 lines' : '612 次提交 · 49,360 行') : en ? 'by line' : '按行计';
}
function heroFrame() {
  const rows = DATA.share[lang()];
  $('edbar').innerHTML = rows.map((r) => `<i data-k="${r.key}" class="${r.key === 'unattributed' ? 'none' : ''}" style="--c:${AGC[r.key]}"></i>`).join('');
  $('edchips').innerHTML = rows.map((r) => `<span data-k="${r.key}" class="${r.key === 'unattributed' ? 'none' : ''}" style="--c:${AGC[r.key]}" title="${r.name}">${logoOf(r.key)}<b>0.0%</b></span>`).join('');
  $('edtabs').innerHTML = FILES.map((f) => `<span><i></i>${f.name.split('/').pop()}</span>`).join('') + '<b></b>';
}
function heroTab(j) {
  const tabs = [...$('edtabs').querySelectorAll('span')], bar = $('edtabs').querySelector('b');
  tabs.forEach((x, i) => x.classList.toggle('on', i === j));
  bar.style.left = `${tabs[j].offsetLeft}px`; bar.style.width = `${tabs[j].offsetWidth}px`;
}
const rowHtml = (l, n, head) => `<div class="r" style="--c:${AGC[l.who] || 'transparent'}"><span class="n">${n}</span><span class="s ${l.who === 'unattributed' ? 'none' : ''}"></span><span class="x"></span>${head ? `<span class="w ${l.who === 'unattributed' ? 'none' : ''}">${logoOf(l.who)}${l.who === 'unattributed' ? (lang() === 'en' ? 'Unattributed' : '未确认') : agName(l.who)}</span>` : ''}</div>`;
function heroStatic() {
  const f = FILES[2];
  $('ed').style.setProperty('--glow', AGC['claude-code']);
  heroTab(2);
  $('edcode').innerHTML = f.lines.map((l, i) => rowHtml(l, i + 1, i === 0 || f.lines[i - 1].who !== l.who)).join('');
  [...$('edcode').children].forEach((r, i) => { r.classList.add('done'); r.querySelector('.x').innerHTML = synt(f.lines[i].tx) || ' '; r.querySelector('.w')?.classList.add('on'); });
  heroTally(true);
}
async function heroRun() {
  const g = ++hero.gen, alive = () => g === hero.gen;
  const ed = $('ed');
  while (alive()) {
    hero.counts = {}; hero.total = 0; heroTally(false);
    for (const [j, f] of FILES.entries()) {
      heroTab(j);
      const code = $('edcode');
      if (code.children.length) {
        await Promise.all([...code.children].map((r, i) => r.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 260, delay: i * 12, fill: 'forwards' }).finished));
      }
      if (!alive()) return;
      code.innerHTML = f.lines.map((l, i) => rowHtml(l, i + 1, i === 0 || f.lines[i - 1].who !== l.who)).join('');
      const rows = [...code.children];
      for (const [i, l] of f.lines.entries()) {
        await until(() => heroLive() || !alive());
        if (!alive()) return;
        const r = rows[i], x = r.querySelector('.x'), full = synt(l.tx);
        if (l.who !== 'unattributed') ed.style.setProperty('--glow', AGC[l.who]);
        if (i && l.who !== f.lines[i - 1].who) await sleep(200);
        r.classList.add('cur');
        // 一次几个字往外冒：按纯文本长度推进，带着高亮一起
        const plain = l.tx;
        // 按时间推进而不是按帧数，主线程忙的时候也不会写得更慢
        const t1 = performance.now(), dur = Math.max(80, plain.length * 6);
        for (let k = 0; k < 1; await sleep(16)) {
          k = Math.min(1, (performance.now() - t1) / dur);
          x.innerHTML = synt(plain.slice(0, Math.round(plain.length * k))) + '<span class="cr"></span>';
        }
        x.innerHTML = full || ' ';
        r.classList.remove('cur'); r.classList.add('done');
        r.querySelector('.w')?.classList.add('on');
        hero.counts[l.who] = (hero.counts[l.who] || 0) + 1; hero.total++;
        heroTally(false);
        const chip = $('edchips').querySelector(`[data-k="${l.who}"]`);
        chip?.classList.add('hot'); setTimeout(() => chip?.classList.remove('hot'), 400);
        await sleep(l.tx ? 50 : 20);
      }
      await sleep(600);
    }
    // 三个文件写完：换成整个仓库的数字，停一会儿再从头来
    ed.style.setProperty('--glow', AGC['claude-code']);
    heroTally(true);
    $('edl').animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 500, easing: EASE });
    await sleep(3600);
    await until(() => heroLive() || !alive());
  }
}
function reel() {
  const key = lang();
  fitStage();
  if (hero.key === key) return;
  hero.key = key;
  heroFrame();
  $('edcode').innerHTML = '';
  if (RM) return heroStatic();
  heroTab(0);
  setTimeout(heroRun, hero.gen ? 0 : 700);
}
function fitStage() {
  const st = $('stage'), ed = $('ed');
  const k = Math.min(1, st.clientWidth / ed.offsetWidth, st.clientHeight / ed.offsetHeight);
  ed.style.setProperty('--k', k.toFixed(3));
}
// 鼠标在编辑器上：停住，编辑器微微朝鼠标转
const stageEl = $('stage');
stageEl.onpointerenter = () => FINE && (hero.hover = true);
stageEl.onpointerleave = () => { hero.hover = false; $('ed').style.setProperty('--tx', '0deg'); $('ed').style.setProperty('--ty', '0deg'); };
stageEl.onpointermove = (e) => {
  if (!FINE) return;
  const r = $('ed').getBoundingClientRect();
  $('ed').style.setProperty('--ty', `${((e.clientX - r.left) / r.width - 0.5) * 5}deg`);
  $('ed').style.setProperty('--tx', `${(0.5 - (e.clientY - r.top) / r.height) * 4}deg`);
};
// 往下滚：标题慢慢退开
const screenEl = $('screen');
const parallax = () => {
  if (RM) return;
  const p = Math.min(1, Math.max(0, scrollY / screenEl.offsetHeight));
  screenEl.style.setProperty('--py', `${p * 120}px`);
  screenEl.style.setProperty('--po', String(1 - p * 1.1));
};
addEventListener('scroll', parallax, { passive: true });
// 工具标志：鼠标靠近时被吸过去一点
document.querySelectorAll('#agents span').forEach((s) => {
  if (!FINE) return;
  s.onpointermove = (e) => { const r = s.getBoundingClientRect(); s.style.translate = `${(e.clientX - r.left - r.width / 2) * 0.35}px ${(e.clientY - r.top - r.height / 2) * 0.35}px`; };
  s.onpointerleave = () => (s.style.translate = '');
});
function intro() {
  const h1 = document.querySelector('.title h1');

  toast.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none', offset: 0.15 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], { duration: 1500, easing: 'ease-out' });
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-copy]'); if (b) copy(b.dataset.copy, b); });

// ───────── 安装：所有方式一眼摆出来，本机对应的排最前，不用选。
// 第四个字段 ready：已经能用的才可点、可复制；其余标「即将推出」。发布后把它改成 true 就行 ─────────
const VER = DATA.version;
const REPO = 'https://github.com/WroughtMind/creditia';
const ICON = (k) => (DATA.icons[k] ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${DATA.icons[k]}"/></svg>` : '');
const SOON = () => `<span class="soon">${lang() === 'en' ? 'Soon' : '即将推出'}</span>`;
const cpBtn = (text) => `<button class="cp" data-copy="${text.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" aria-label="copy">${COPY_SVG}</button>`;
const MOBILE = /iphone|ipad|ipod|android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const detectOS = () => { const p = ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent).toLowerCase(); return /win/.test(p) ? 'win' : /linux|x11|cros/.test(p) && !/android/.test(p) ? 'linux' : 'mac'; };
const asset = (f) => `${REPO}/releases/download/v${VER}/${f.replace('{v}', VER)}`;
const L2 = (x) => (Array.isArray(x) ? x[lang() === 'en' ? 1 : 0] ?? x[0] : x);
// 桌面 App：每个平台一个主安装包，其余格式跟在后面，再加一行包管理器
const APP = {
  mac: { name: 'macOS', icon: 'apple', sub: ['Apple 芯片、Intel 通用', 'Apple silicon & Intel'], files: [['.dmg', 'creditia_{v}_universal.dmg', false]], pm: ['brew install --cask wroughtmind/tap/creditia', false] },
  win: { name: 'Windows', icon: 'windows', sub: ['Windows 10 / 11', 'Windows 10 / 11'], files: [['.exe', 'creditia_{v}_x64-setup.exe', false], ['.msi', 'creditia_{v}_x64_en-US.msi', false], ['ARM64', 'creditia_{v}_arm64-setup.exe', false]], pm: ['winget install WroughtMind.Creditia', false] },
  linux: { name: 'Linux', icon: 'linux', sub: ['x64', 'x64'], files: [['.AppImage', 'creditia_{v}_amd64.AppImage', false], ['.deb', 'creditia_{v}_amd64.deb', false], ['.rpm', 'creditia-{v}-1.x86_64.rpm', false]], pm: ['flatpak install flathub dev.creditia.app', false] },
};
// 命令行：按来源分组，一行一个
const CLI = () => [
  ['npm · pnpm · bun', [['npx creditia analyze', false], ['npm i -g creditia', false], ['pnpm add -g creditia', false], ['bun add -g creditia', false]]],
  ['Homebrew · Scoop', [['brew install wroughtmind/tap/creditia', false], ['scoop install creditia', false]]],
  [lang() === 'en' ? 'One-line script' : '一行脚本', [['curl -fsSL https://wroughtmind.github.io/creditia/install.sh | sh', false], ['irm https://wroughtmind.github.io/creditia/install.ps1 | iex', false]]],
  ['Docker · Cargo', [['docker run --rm -v "$PWD:/repo" ghcr.io/wroughtmind/creditia analyze', false], [`cargo install --git ${REPO} creditia-cli`, true]]],
  [lang() === 'en' ? 'From source' : '从源码', [[`git clone ${REPO} && cd creditia/packages/cli && npm i && npm link`, true]]],
];
const SKILL_AGENTS = ['Claude Code', 'Codex', 'Cursor', 'Gemini CLI', 'OpenCode', 'GitHub Copilot', 'Cline', 'Qwen Code', 'Roo Code', 'Kilo Code'];
const OSN = { mac: 'macOS', win: 'Windows', linux: 'Linux' };
function prompt() {
  const en = lang() === 'en', os = MOBILE ? '' : OSN[detectOS()];
  return en
    ? `Install creditia (${REPO})${os ? ` on this ${os} machine` : ''} and use it to work out which AI tools and models wrote the code in this repo.\n1. Install the command-line tool and the skills/creditia skill, following the README.\n2. Run creditia analyze at the repo root and tell me the result.\n3. Ask me before publishing or committing anything.`
    : `帮我${os ? `在这台 ${os} 上` : ''}装上 creditia（${REPO}），用它算出这个仓库的代码是哪些 AI 工具和模型写的：\n1. 按 README 安装命令行工具和 skills/creditia 这个 skill；\n2. 在仓库根目录运行 creditia analyze，把结果告诉我；\n3. 公开或提交任何东西之前先问我。`;
}
const cmdLine = (cmd, ready, cls = 'line') => `<div class="${cls}${ready ? '' : ' off'}"><span>${cls === 'l' ? '<i class="p">$</i>' : ''}${esc(cmd)}</span>${ready ? cpBtn(cmd) : SOON()}</div>`;
const yamlHl = (s) => esc(s).replace(/^(\s*-?\s*)([\w-]+):/gm, '$1<span class="k">$2</span>:');
function install() {
  const en = lang() === 'en', me = detectOS();
  $('vline').innerHTML = en ? `Current <code>v${VER}</code> · nightly builds: <code>creditia@next</code> on npm, <code>@main</code> for the Action` : `当前 <code>v${VER}</code> · 预览版：npm 用 <code>creditia@next</code>，Action 用 <code>@main</code>`;
  // 交给 agent：最省事，放第一个
  const say = prompt();
  $('ib-ask').innerHTML = `<h3>${en ? 'Ask your agent' : '交给 agent'}</h3><div class="say">${esc(say)}</div><button class="go" data-copy="${esc(say).replace(/"/g, '&quot;')}">${COPY_SVG}${en ? 'Copy, then paste to your agent' : '复制，发给 agent'}</button>`;
  // 桌面 App：本机排第一
  const order = MOBILE ? ['mac', 'win', 'linux'] : [me, ...['mac', 'win', 'linux'].filter((k) => k !== me)];
  $('ib-app').innerHTML = `<h3>${en ? 'Desktop app' : '桌面 App'}</h3><div>${order.map((k) => {
    const p = APP[k], isMe = k === me && !MOBILE;
    const files = p.files.map(([label, f, r]) => (r ? `<a class="fmt" href="${asset(f)}" download>${label}</a>` : `<span class="fmt" title="${f.replace('{v}', VER)}">${label}</span>`)).join('');
    const soonAll = p.files.every(([, , r]) => !r);
    return `<div class="plat${isMe ? ' me' : ''}"><i>${ICON(p.icon)}</i><b>${p.name}${isMe ? `<em>${en ? 'this device' : '本机'}</em>` : ''}</b><span class="fmts">${files}${soonAll ? SOON() : ''}</span><div class="pm"><span>${esc(p.pm[0])}</span>${p.pm[1] ? cpBtn(p.pm[0]) : ''}</div></div>`;
  }).join('')}</div>`;
  // 命令行：一个终端，按来源分组；悬停一行出现复制
  $('ib-cli').innerHTML = `<h3>${en ? 'Command line' : '命令行'}<small>Node 22+</small><span class="key"><i></i>${en ? 'dimmed: coming soon' : '暗的：即将推出'}</span></h3><div class="tm">${CLI().map(([g, lines]) => `<div class="c"># ${g}</div>${lines.map(([c, r]) => cmdLine(c, r, 'l')).join('')}`).join('')}</div>`;
  // Agent skill：一行命令装进本机所有 agent；手动装 Claude Code 现在就能用
  $('ib-skill').innerHTML = `<h3>Agent skill</h3><div class="logos">${SKILL_AGENTS.map((n) => { const t = DATA.tools.find((x) => x.name === n); return t ? `<span title="${n}">${t.svg}</span>` : ''; }).join('')}</div>${cmdLine('npx creditia skill add', false)}${cmdLine(`git clone --depth 1 ${REPO} /tmp/creditia && cp -r /tmp/creditia/skills/creditia ~/.claude/skills/`, true)}`;
  // CI
  const gh = `- uses: WroughtMind/creditia@main\n  with:\n    badge: assets/credits-badge.svg\n    doc: CREDITS.md`;
  $('ib-ci').innerHTML = `<h3>CI<small>GitHub Actions</small></h3><div class="yaml">${yamlHl(gh)}${cpBtn(gh)}</div><div class="line off"><span>GitLab CI · ghcr.io/wroughtmind/creditia</span>${SOON()}</div>`;
  // 首屏按钮：按本机系统写；手机上没有能装的 App，只写「安装」
  $('herodl').innerHTML = MOBILE ? `${DL_SVG}${en ? 'Install' : '安装'}` : `${ICON(APP[me].icon)}${en ? `Get it for ${APP[me].name}` : `下载 ${APP[me].name} 版`}`;
}

// ───────── 顶栏：离开首屏后变实底；往下滚收起，往上滚出现；当前在哪一节，药丸就滑到哪 ─────────
const hdr = document.querySelector('header');
let hy = scrollY;
addEventListener('scroll', () => {
  const y = scrollY, past = y > screenEl.offsetHeight - 120;
  hdr.classList.toggle('solid', past);
  if (Math.abs(y - hy) > 6) { hdr.classList.toggle('away', past && y > hy && y > screenEl.offsetHeight + 200 && lb.hidden); hy = y; }
}, { passive: true });
const navPill = document.querySelector('nav .pill');
const navTo = (id) => {
  const a = document.querySelector(`nav a[href="#${id}"]`);
  document.querySelectorAll('nav a').forEach((x) => x.classList.toggle('on', x === a));
  if (a) { navPill.style.left = `${a.offsetLeft}px`; navPill.style.width = `${a.offsetWidth}px`; navPill.style.opacity = 1; } else navPill.style.opacity = 0;
};
// 视口 40% 高度那条线落在哪一节，就是当前节
const SECS = ['looks', 'lines', 'use', 'install'];
let curSec;
const spy = () => { let id = null; for (const k of SECS) if ($(k).getBoundingClientRect().top < innerHeight * 0.4) id = k; if (id !== curSec) { curSec = id; navTo(id); } };
addEventListener('scroll', spy, { passive: true });
addEventListener('resize', () => { curSec = undefined; spy(); });

// ───────── 出场：滚到哪，哪里的标题一个字一个字升起来 ─────────
const io = new IntersectionObserver((es) => {
  let k = 0;
  es.forEach((x) => {
    if (!x.isIntersecting) return;
    const el = x.target; io.unobserve(el);
    el.style.transitionDelay = `${k++ * 90}ms`;
    el.classList.add('in');
    const h2 = el.querySelector('h2');
    if (h2 && !RM) rise(split(h2), { step: lang() === 'zh' ? 40 : 70, dur: 1000 });
    if (el.classList.contains('editor')) setTimeout(scan, 300);
  });
}, { rootMargin: '0px 0px -10% 0px' });

// ───────── 语言、主题、复制 ─────────
function applyLang() {
  document.querySelectorAll('[data-i]').forEach((el) => (el.innerHTML = t(el.dataset.i)));
  $('lang').textContent = lang() === 'en' ? '中' : 'EN';
  document.title = lang() === 'en' ? 'creditia — which AI wrote your code' : 'creditia — 你的代码，是哪些 AI 写的';
  reel(); wall(); lines(); usage(); install();
}
// 换语言：整页淡入淡出；换主题：从按钮那里一圈扩开
const transition = (fn, circleFrom) => {
  if (!document.startViewTransition || RM) return fn();
  const root = document.documentElement;
  if (circleFrom) root.classList.add('vt-theme');
  const vt = document.startViewTransition(fn);
  if (circleFrom) {
    const r = circleFrom.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const R = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
    vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${cx}px ${cy}px)`, `circle(${R}px at ${cx}px ${cy}px)`] }, { duration: 750, easing: 'cubic-bezier(.65,0,.25,1)', pseudoElement: '::view-transition-new(root)' }));
  }
  vt.finished.finally(() => root.classList.remove('vt-theme'));
};
$('lang').onclick = () => transition(() => {
  document.documentElement.lang = lang() === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('ct-lang', document.documentElement.lang); } catch (e) {}
  applyLang(); split(document.querySelector('.title h1'));
});
const onTheme = () => {};
$('theme').onclick = (e) => {
  const b = e.currentTarget;
  transition(() => {
    document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('ct-theme', document.documentElement.dataset.theme); } catch (err) {}
    onTheme();
  }, b);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) onTheme(); });
$('copy').dataset.copy = 'npx creditia analyze';
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { reel(); const k = W.k; if ((innerWidth < 640 ? 0.58 : innerWidth < 1000 ? 0.78 : 1) !== k) wall(); else measure(); }, 200); });
applyLang();
intro();
document.querySelectorAll('.rise').forEach((el) => io.observe(el));
</script>
</body>
</html>

<style>

:root[data-theme="dark"] {
  --bg: #0C0C0B; --ink: #ECE8DF; --soft: #9D988E; --faint: #5F5B54; --line: rgba(236,232,223,.12); --line2: rgba(236,232,223,.06);
  --card: #141413; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 30px 70px -28px rgba(0,0,0,.9);
  --hero: #070708; --hero-ink: #F1EADC; --hero-soft: #A39B8B; --hero-line: rgba(237,230,216,.18);
  --term: #000; --term-ink: #E8E4DB;
  --c-verified: #ECE8DF; --c-declared: #8E8A81; --c-inferred: #54514B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 Inter, -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s; }
a { color: inherit; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.serif { font-family: "Instrument Serif", "Noto Serif SC", "Songti SC", serif; font-weight: 400; }
:lang(zh) .serif { font-family: "Noto Serif SC", "Songti SC", "Instrument Serif", serif; font-weight: 500; }
.wrap { width: min(1120px, 100% - 64px); margin: 0 auto; }
h1, h2 { margin: 0; text-wrap: balance; }
h2 { font-size: clamp(32px, 4vw, 52px); line-height: 1.1; }
:lang(zh) h2 { font-size: clamp(28px, 3.2vw, 42px); line-height: 1.3; }
section { padding-top: clamp(100px, 13vw, 168px); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.head p { margin: 12px 0 0; color: var(--soft); }

/* ───────── 顶栏 ───────── */
header { position: fixed; inset: 0 0 auto; z-index: 40; color: var(--hero-ink); transition: transform .45s cubic-bezier(.2,.8,.2,1), background-color .3s, color .3s, box-shadow .3s; }
header.solid { color: var(--ink); background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 1px 0 var(--line); }
header.away { transform: translateY(-100%); }
header .wrap { height: 64px; display: flex; align-items: center; gap: 12px; }
nav { display: flex; gap: 2px; margin-left: 28px; position: relative; }
nav a { position: relative; z-index: 1; padding: 6px 12px; border-radius: 99px; font-size: 13.5px; text-decoration: none; opacity: .66; transition: opacity .2s; }
nav a:hover, nav a.on { opacity: 1; }
nav .pill { position: absolute; z-index: 0; top: 0; height: 100%; border-radius: 99px; background: var(--line2); box-shadow: inset 0 0 0 1px var(--line); opacity: 0; transition: left .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1), opacity .3s; }
header:not(.solid) nav .pill { background: var(--hero-line); box-shadow: none; }
.get { height: 32px; padding: 0 14px; border-radius: 99px; font: 500 13px/1 Inter, sans-serif; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; background: currentColor; margin-left: 6px; }
.get span { color: var(--bg); }
header:not(.solid) .get span { color: var(--hero); }
.get svg { width: 13px; height: 13px; fill: var(--bg); }
header:not(.solid) .get svg { fill: var(--hero); }
section, #screen { scroll-margin-top: 64px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; text-decoration: none; }
.brand svg { width: 20px; height: 20px; overflow: visible; }
/* 标题后面的 *：creditia 的标志，也就是排版里「出处在这儿」的那个星号 */
.title h1 .ast { display: inline-block; width: .4em; height: .4em; margin-left: .08em; position: relative; top: -.62em; } /* 不撑高行 */
.title h1 .ast svg { display: block; width: 100%; height: 100%; overflow: visible; }
.grow { flex: 1; }
.ctl { display: flex; gap: 2px; }
.ctl button, .ctl a { height: 32px; min-width: 32px; padding: 0 9px; border-radius: 99px; border: 0; background: transparent; opacity: .72; font: 500 12.5px/1 Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.ctl button:hover, .ctl a:hover { opacity: 1; background: var(--hero-line); }
.ctl svg { width: 16px; height: 16px; }
#theme .sun { display: none; }
:root[data-theme="dark"] #theme .sun { display: block; }
:root[data-theme="dark"] #theme .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #theme .sun { display: block; } :root:not([data-theme="light"]) #theme .moon { display: none; } }

/* ───────── 首屏 ───────── */
#screen { position: relative; height: 100vh; height: 100svh; min-height: 660px; max-height: 1100px; overflow: hidden; background: var(--hero); color: var(--hero-ink); transition: background-color .3s, color .3s; }
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 130%; }
/* 首屏右边：catnap 整个仓库摊开成一片代码地图，一个文件一段、一行一道线；一道光扫过去，每一行染上写它的 AI 的颜色 */
.field { position: absolute; z-index: 1; top: 96px; bottom: 52px; left: calc(max(32px, (100vw - 1120px) / 2) + min(520px, 46vw) + 64px); right: 0; display: flex; flex-direction: column; gap: 16px; translate: 0 calc(var(--py, 0px) * -0.3); }
.fcap { display: flex; justify-content: space-between; gap: 16px; padding-right: max(32px, calc((100vw - 1120px) / 2)); font-size: 12px; color: var(--hero-soft); white-space: nowrap; }
.fcap #fcount { color: var(--hero-ink); font-variant-numeric: tabular-nums; transition: opacity .6s; }
.fcv { position: relative; flex: 1; min-height: 0; -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent); mask-image: linear-gradient(90deg, #000 78%, transparent); }
.fcv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ftip { position: absolute; z-index: 2; pointer-events: none; padding: 9px 11px; border-radius: 10px; background: var(--hero); color: var(--hero-ink); box-shadow: 0 0 0 1px var(--hero-line), 0 14px 40px -12px rgba(0,0,0,.45); font-size: 12px; line-height: 1.6; white-space: nowrap; }
.ftip b { display: block; font: 500 12px "JetBrains Mono", monospace; margin-bottom: 3px; }
.ftip i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.ftip span { display: block; color: var(--hero-soft); } .ftip span em { font-style: normal; color: var(--hero-ink); font-variant-numeric: tabular-nums; margin-left: 6px; }
.fbar { display: flex; gap: 2px; height: 3px; margin: -4px max(32px, calc((100vw - 1120px) / 2)) 0 0; }
.fbar i { height: 100%; border-radius: 2px; width: 0; }
.flegend { display: flex; flex-wrap: wrap; gap: 6px 20px; padding-right: max(32px, calc((100vw - 1120px) / 2)); font-size: 13px; color: var(--hero-soft); }
.flegend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; cursor: default; transition: color .2s, opacity .2s; }
.flegend span svg { width: 15px; height: 15px; fill: currentColor; }
.flegend span i { width: 13px; height: 13px; border-radius: 3px; border: 1px dashed currentColor; }
.flegend span em { font-style: normal; color: var(--hero-ink); font-variant-numeric: tabular-nums; }
.flegend.focus span:not(.on) { opacity: .4; }
.title { translate: 0 var(--py, 0px); opacity: var(--po, 1); }
.title { position: absolute; z-index: 2; left: max(32px, calc((100vw - 1120px) / 2)); top: 50%; transform: translateY(-48%); width: min(520px, 46vw); }
.title h1 { font-size: clamp(48px, 6vw, 84px); line-height: 1; }
:lang(zh) .title h1 { font-size: clamp(40px, 4.6vw, 64px); line-height: 1.24; }
.title p { margin: 26px 0 0; font-size: 17px; line-height: 1.75; color: var(--hero-soft); max-width: 27em; text-wrap: pretty; }
.cmd { margin-top: 32px; display: inline-flex; align-items: center; gap: 14px; height: 46px; padding: 0 6px 0 16px; border-radius: 10px; border: 1px solid var(--hero-line); font-size: 14.5px; }
.cmd .p { color: var(--hero-soft); margin-right: 8px; }
.acts { margin-top: 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.acts .cmd { margin-top: 0; }
.dl { height: 46px; padding: 0 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 9px; text-decoration: none; background: var(--hero-ink); color: var(--hero); font-weight: 500; font-size: 14.5px; transition: transform .2s, box-shadow .2s; }
.dl:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -12px var(--hero-ink); }
.dl svg { width: 16px; height: 16px; fill: currentColor; }
.cmd button { height: 34px; width: 34px; border-radius: 7px; border: 0; background: transparent; color: var(--hero-soft); cursor: pointer; display: grid; place-items: center; }
.cmd button:hover { background: var(--hero-line); color: var(--hero-ink); }
.cmd button svg { width: 16px; height: 16px; }
.agents { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 14px 16px; color: var(--hero-soft); max-width: 470px; }
.agents span { display: inline-flex; position: relative; transition: translate .5s cubic-bezier(.2,.8,.2,1); }
.agents svg { width: 24px; height: 24px; fill: currentColor; display: block; transition: color .15s; }
.agents span:hover { color: var(--hero-ink); }
.agents span::after { content: attr(data-n); position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--hero-ink); opacity: 0; pointer-events: none; transition: opacity .15s; }
.agents span:hover::after { opacity: 1; }

/* ───────── 风格：一张看样台。署名卡原来就躺在台面上，镜头往后拉、压低，四周摊着同一份署名的各种样子 ───────── */
#looks { position: relative; z-index: 1; }
.tstage { position: relative; height: 100vh; height: 100svh; overflow: hidden; background: var(--tbg, var(--bg)); perspective: 1500px; perspective-origin: 50% 30%; touch-action: pan-y; }
#looks.pin .tstage { position: sticky; top: 0; }
html.zoom #looks { margin-top: -100vh; padding-top: 0; }
#looks.idle .tstage { visibility: hidden; }
.tview { position: absolute; inset: 0; }
.table { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
/* 远处的照片沉进底色里，像台灯照不到的地方 */
/* 下沿也化进底色：舞台放开往上走时，台面是慢慢没进去的，不是一刀切开 */
.tfog { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(var(--tbg, var(--bg)) 6%, transparent 42%, transparent 58%, var(--tbg, var(--bg)) 93%), radial-gradient(120% 90% at 50% 64%, transparent 50%, var(--tbg, var(--bg)) 96%); }
.print { position: absolute; padding: 0; border: 0; border-radius: 5px; background: var(--line2); cursor: zoom-in; transform: rotate(var(--r, 0deg)); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 26px 44px -22px rgba(0,0,0,.45); transition: transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .6s; -webkit-tap-highlight-color: transparent; }
.print img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: inherit; -webkit-user-drag: none; pointer-events: none; }
.print .cap { position: absolute; left: 2px; top: calc(100% + 16px); font: 19px/1.3 "JetBrains Mono", monospace; color: var(--faint); white-space: nowrap; transition: color .3s; }
.print:hover, .print:focus-visible { z-index: 2; transform: translateY(-18px) scale(1.035); box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 50px 70px -30px rgba(0,0,0,.55); outline: none; }
.print:hover .cap, .print:focus-visible .cap { color: var(--ink); }
.tcard { position: absolute; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 26px 44px -22px rgba(0,0,0,.45); }
.thead { position: absolute; z-index: 2; left: 0; right: 0; top: calc(64px + 6vh); pointer-events: none; }
.thead p { margin: 12px 0 0; color: var(--soft); }
/* 放大看 */
#lb { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,8,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; grid-template-rows: 1fr auto; padding: 4vh 4vw 3vh; color: #EEE9DF; }
#lb .big { display: grid; place-items: center; min-height: 0; }
#lb.tall .big { overflow-y: auto; place-items: start center; overscroll-behavior: contain; }
#lb.tall .big img { max-height: none; width: min(560px, 92vw); }
#lb .big img { max-height: calc(100vh - 8vh - 90px); max-width: 92vw; width: auto; height: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
#lb .bar { display: flex; align-items: center; gap: 18px; justify-content: center; padding-top: 18px; font-size: 14.5px; }
#lb .bar b { font-weight: 600; }
#lb .bar span { color: #A8A296; }
#lb button { height: 38px; min-width: 38px; border-radius: 99px; border: 1px solid rgba(238,233,223,.2); background: transparent; color: #EEE9DF; cursor: pointer; font-size: 16px; }
#lb button:hover { background: rgba(238,233,223,.1); }
#lb .x { position: absolute; top: 18px; right: 18px; }

/* ───────── 首屏 → 出处：首屏钉住，镜头推进一个文件，线变成编辑器里的字（宽屏才这样，其余照常往下排） ───────── */
#zcv { display: none; }
html.zoom .zstage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
html.zoom #screen { height: 100%; min-height: 0; max-height: none; }
html.zoom #lines { position: absolute; inset: 0; z-index: 2; padding: 64px 0 0; display: flex; flex-direction: column; justify-content: center; background: var(--bg); opacity: 0; pointer-events: none; }
html.zoom #lines.live { pointer-events: auto; }
html.zoom #lines .tx { opacity: var(--zt, 1); }
html.zoom .title { z-index: 4; }
html.zoom #zcv { display: block; position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
/* 第二幕：往下滚一点，亮一行出处 */
html.zoom .ln .mark { transform: scaleY(0); transition: transform .5s cubic-bezier(.3,1.5,.5,1); }
html.zoom .ln .who { transform: translateX(10px); transition: opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1); }
html.zoom .ln.src .mark { transform: none; }
html.zoom .ln.src .who { opacity: 1; transform: none; }
/* 最后一幕：各行的颜色流进一条份额条，份额条从那一道缝里展开成署名卡 */
#zcard { display: none; }
.zcard { padding: 30px 32px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); transition: box-shadow .5s; }
.zcard.lift { box-shadow: var(--shadow); }
html.zoom #zcard { display: block; position: absolute; z-index: 5; left: 50%; top: 53%; width: min(480px, calc(100vw - 48px)); translate: -50% -50%; visibility: hidden; }
.zcard .zt { font-size: 46px; line-height: 1; }
.zcard .zm { margin-top: 10px; font-size: 13px; color: var(--soft); }
.zcard .zbar { display: flex; height: 10px; margin: 26px 0 20px; border-radius: 3px; overflow: hidden; }
.zcard .zbar i { flex: none; height: 100%; }
.zcard .zrows { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 28px; font-size: 13.5px; }
.zcard .zrows span { display: flex; align-items: center; gap: 9px; min-width: 0; }
.zcard .zrows svg { flex: none; width: 15px; height: 15px; fill: currentColor; }
.zcard .zrows span > i { flex: none; width: 9px; height: 9px; margin: 0 3px; border-radius: 50%; background: currentColor; }
.zcard .zrows b { font-weight: 400; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zcard .zrows em { margin-left: auto; font-style: normal; color: var(--soft); font-variant-numeric: tabular-nums; }
.zcard .zf { margin-top: 22px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--faint); }
.zcard .zf svg { width: 13px; height: 13px; }
/* 卡片摊开成风格墙：飞行中的是墙上图块的替身，落地后换回真的 */

/* ───────── 一行一行 ───────── */
.legend { margin-top: 36px; display: flex; gap: 8px; flex-wrap: wrap; }
.legend span { user-select: none; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); font-size: 14px; color: var(--soft); transition: background-color .15s, color .15s; }
.legend span:hover, .legend span.on { background: var(--line2); color: var(--ink); }
.legend i { width: 11px; height: 11px; border-radius: 3px; }
.sw-verified { background: var(--c-verified); }
.sw-declared { background: var(--c-declared); }
.sw-inferred { background: repeating-linear-gradient(45deg, var(--c-inferred) 0 2px, transparent 2px 4px); outline: 1px solid var(--c-inferred); }
.sw-unknown { outline: 1px dashed var(--faint); }
.editor { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
.code { padding: 14px 0 16px; font-size: 13.5px; line-height: 1.95; overflow-x: auto; }
.ln { display: grid; grid-template-columns: 46px 4px 1fr auto; align-items: center; transition: opacity .2s; padding-right: 16px; min-width: 680px; }
.ln .no { text-align: right; padding-right: 14px; color: var(--faint); font-size: 12px; }
.ln .mark { align-self: stretch; }
.ln .tx { padding-left: 18px; white-space: pre; }
.ln .who { font: 12.5px Inter, sans-serif; color: var(--soft); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.ln:hover .who, .ln.lit .who { opacity: 1; }
.code.focus .ln:not(.lit) { opacity: .25; }
.m-verified { background: var(--c-verified); }
.m-declared { background: var(--c-declared); }
.m-inferred { background: repeating-linear-gradient(180deg, var(--c-inferred) 0 3px, transparent 3px 6px); }
.m-unknown { background: repeating-linear-gradient(180deg, var(--faint) 0 2px, transparent 2px 6px); opacity: .7; }
.tok-k { color: var(--soft); }
.tok-c { color: var(--faint); font-style: italic; }

/* ───────── 用法：四张卡都是会自己演的小样，高度固定，内容在里面滚，不把页面撑开 ───────── */
/* 用法：左边一列挑一种，右边只演这一种，演示底下就是它的安装 */
.uses { margin-top: 48px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 56px; align-items: start; }
.upick { position: sticky; top: 96px; display: grid; gap: 6px; }
.upick button { display: grid; gap: 4px; padding: 16px 18px 17px; border: 0; border-radius: 16px; background: transparent; text-align: left; cursor: pointer; transition: background-color .3s; }
.upick b { font-size: 17px; font-weight: 600; color: var(--soft); transition: color .3s; }
.upick span { font-size: 13.5px; line-height: 1.55; color: var(--faint); transition: color .3s; }
.upick button:hover b { color: var(--ink); }
.upick button[aria-selected="true"] { background: var(--card); box-shadow: var(--shadow); }
.upick button[aria-selected="true"] b { color: var(--ink); }
.upick button[aria-selected="true"] span { color: var(--soft); }
.ushow { min-width: 0; }
.ubar { display: flex; align-items: center; gap: 12px; min-height: 30px; margin-bottom: 10px; }
.ubar small { min-width: 0; font-size: 12.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ubar .dstep { margin-left: auto; }
.again { margin-left: auto; width: 28px; height: 28px; border-radius: 99px; border: 0; background: transparent; color: var(--faint); cursor: pointer; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s, color .15s, background-color .15s; }
.again.on { opacity: 1; pointer-events: auto; }
.again:hover { color: var(--ink); background: var(--line2); }
.again svg { width: 15px; height: 15px; }
.ustage { position: relative; display: grid; height: 470px; }
.upane { grid-area: 1 / 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(12px); transition: opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s .5s; }
.upane.on { opacity: 1; visibility: visible; transform: none; transition: opacity .5s .08s, transform .6s .08s cubic-bezier(.2,.8,.2,1); }
.upane > * { flex: 1; min-height: 0; }
.upane[data-w="cli"] { background: var(--term); }
.upane[data-w="agent"], .upane[data-w="ci"] { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.upane[data-w="ci"] { padding: 20px 22px 22px; }
.upane .term, .upane .agent { -webkit-mask-image: linear-gradient(transparent, #000 24px); mask-image: linear-gradient(transparent, #000 24px); }
/* 命令行 */
.term { font-variant-ligatures: none; background: var(--term); color: var(--term-ink); padding: 20px 24px 24px; font-size: 12.5px; line-height: 1.72; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: #8C877D; }
.term .o { color: #A9A397; }
.term .d { color: #625E57; }
.term .bd { font-weight: 600; color: #F1EADC; }
.term .g { display: inline-block; animation: grow .7s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes grow { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.term .ok { color: #7CCB9F; }
.term a.out { color: var(--term-ink); text-decoration: none; border-bottom: 1px dashed rgba(232,228,219,.28); transition: border-color .15s, color .15s; }
.term a.out:hover { border-bottom-color: currentColor; color: #fff; }
.term .spin::before { content: "⠋"; display: inline-block; width: 1.2em; color: #D97757; animation: braille .8s steps(1) infinite; }
@keyframes braille { 0% { content: "⠋"; } 12% { content: "⠙"; } 25% { content: "⠹"; } 37% { content: "⠸"; } 50% { content: "⠼"; } 62% { content: "⠴"; } 75% { content: "⠦"; } 87% { content: "⠧"; } }
#peek { position: fixed; z-index: 45; width: 220px; padding: 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); pointer-events: none; opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .18s, transform .25s cubic-bezier(.2,.8,.2,1); }
#peek.on { opacity: 1; transform: none; }
#peek img { width: 100%; border-radius: 6px; }
#peek pre { margin: 0; padding: 6px 8px; font: 10.5px/1.55 "JetBrains Mono", monospace; color: var(--soft); white-space: pre; overflow-x: hidden; max-height: 210px; overflow: hidden; }
#peek small { display: flex; justify-content: space-between; padding: 7px 4px 0; font-size: 11.5px; color: var(--faint); }
/* agent */
.agent { position: relative; padding: 20px 22px 24px; overflow: hidden; display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; line-height: 1.65; }
.agent > * { flex: none; }
.agent .u { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--bg); padding: 7px 13px; border-radius: 14px 14px 4px 14px; }
.agent .a { display: grid; grid-template-columns: 16px 1fr; gap: 9px; }
.agent .a > svg { width: 14px; height: 14px; margin-top: 4px; fill: #D97757; }
.agent .a .wd { display: inline; }
.tool { font: 11.5px/1.6 "JetBrains Mono", monospace; min-width: 0; font-variant-ligatures: none; }
.tool .hd { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tool .hd b { font-weight: 600; flex: none; }
.tool .hd span { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .st { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #4FA37F; transition: background-color .3s; }
.tool .st.run { background: transparent; border: 1.5px solid var(--line); border-top-color: var(--ink); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tool .out { margin: 5px 0 0 3px; padding-left: 13px; border-left: 1px solid var(--line); color: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; }
.tool .out img { margin: 8px 0 2px; width: min(260px, 100%); border-radius: 6px; box-shadow: 0 10px 30px -14px rgba(0,0,0,.5); }
.tool .add { display: block; background: rgba(79,163,127,.13); color: #2E7D5B; padding: 1px 6px; border-radius: 4px; }
:root[data-theme="dark"] .tool .add { color: #7CCB9F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tool .add { color: #7CCB9F; } }
/* GitHub Action：卡片里三步轮着演——本机 publish、GitHub 上每次推送、你得到的东西 */
.flow2 { display: flex; flex-direction: column; gap: 12px; }
.fst { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
.fst li { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--faint); white-space: nowrap; cursor: pointer; transition: color .3s; }
.fst li:hover { color: var(--ink); }
.fst li b { flex: none; width: 19px; height: 19px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 500 10.5px Inter, sans-serif; transition: background-color .3s, color .3s, border-color .3s; }
.fst li.on { color: var(--ink); } .fst li.on b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fst li.done { color: var(--soft); } .fst li.done b { border-color: #4FA37F; color: #4FA37F; }
.fst i { flex: 1; min-width: 8px; height: 1px; background: var(--line); position: relative; }
.fst i::after { content: ""; position: absolute; inset: 0; background: #4FA37F; transform: scaleX(0); transform-origin: 0 0; transition: transform .7s cubic-bezier(.5,0,.3,1); }
.fst i.done::after { transform: none; }
.fstage { position: relative; flex: 1; min-height: 0; }
.fpane { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .45s, transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s .45s; }
.fpane.on { opacity: 1; visibility: visible; transform: none; transition: opacity .45s, transform .45s cubic-bezier(.2,.8,.2,1); }
.res td.m { display: none; }
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: start; }
.mt { flex: 1; min-height: 0; border-radius: 12px 12px 0 0; background: var(--term); color: var(--term-ink); padding: 14px 16px; font: 12px/1.75 "JetBrains Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere; font-variant-ligatures: none; }
.mt .p { color: #8C877D; } .mt .o { color: #A9A397; } .mt .ok { color: #7CCB9F; }
.yml { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.yml .fn { padding: 8px 14px; border-bottom: 1px solid var(--line); font: 11.5px "JetBrains Mono", monospace; color: var(--soft); }
.yml pre { margin: 0; padding: 10px 14px 12px; font: 11px/1.6 "JetBrains Mono", monospace; color: var(--soft); white-space: pre; overflow: hidden; }
.yml pre .hl { color: var(--ink); background: color-mix(in srgb, #E2B93B 22%, transparent); border-radius: 3px; transition: background-color 1s; }
.yml pre .hl.off { background: transparent; }
.yml pre .k { color: var(--faint); }
.run { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px 14px; font-size: 13px; }
.run .rh { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.run .rh b { font-weight: 600; } .run .rh span { color: var(--faint); font-size: 12px; margin-left: auto; font-family: "JetBrains Mono", monospace; }
.run .s { display: flex; align-items: center; gap: 9px; padding: 4px 0; color: var(--faint); transition: color .3s; }
.run .s.go, .run .s.ok { color: var(--ink); }
.run .s small { margin-left: auto; color: var(--faint); font: 11.5px "JetBrains Mono", monospace; }
.ico { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.go .ico { border-color: #D29922; border-right-color: transparent; animation: spin .8s linear infinite; }
.ok .ico { border-color: #4FA37F; background: #4FA37F; }
.ok .ico::after { content: ""; width: 5px; height: 3px; border: 1.5px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.res { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); overflow: hidden; position: relative; }
.res .fn { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font: 11.5px "JetBrains Mono", monospace; color: var(--soft); }
.res .fn em { margin-left: auto; font: 500 11px Inter, sans-serif; font-style: normal; color: #4FA37F; opacity: 0; transition: opacity .4s; }
.res.new .fn em { opacity: 1; }
.res .bd { padding: 10px 12px; font-size: 13px; }
.res .bd h5 { margin: 0 0 8px; font-size: 16px; font-weight: 600; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.res .bd img.cb { height: 20px; width: auto; }
.res table { border-collapse: collapse; font-size: 12px; width: 100%; }
.res td, .res th { border: 1px solid var(--line); padding: 3px 8px; text-align: left; white-space: nowrap; }
.res td.n { text-align: right; font-variant-numeric: tabular-nums; }
.res .url { display: flex; align-items: center; gap: 6px; margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--line); font: 11px "JetBrains Mono", monospace; color: var(--soft); }
.res .url i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.res .url span { margin-left: 6px; flex: 1; text-align: center; background: var(--line2); border-radius: 6px; padding: 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .site img { width: 100%; display: block; }
/* App：一块桌面，上面是真的 App（打包成网页的 creditia），先自己演一遍，随时可以接手 */
/* App 的桌面按宽度缩放；行比它高时，桌面往下多长一截，跟同一行的卡片齐平 */
.deskbox { position: relative; overflow: hidden; background: #1b1b22; }
.desk { position: absolute; left: 0; top: 0; width: 1040px; height: 840px; transform-origin: 0 0; transform: scale(var(--ds, 1)); overflow: hidden; user-select: none; -webkit-user-select: none;
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif; color: #1d1d1f; --mb: rgba(246,240,236,.42); --mb-ink: #1d1d1f; }
:root[data-theme="dark"] .desk { --mb: rgba(24,22,34,.42); --mb-ink: #f2f2f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .desk { --mb: rgba(24,22,34,.42); --mb-ink: #f2f2f2; } }
.desk .wp { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .6s; }
.mbar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 26px; display: flex; align-items: center; gap: 20px; padding: 0 16px; background: var(--mb); color: var(--mb-ink); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7); font-size: 13px; }
.mbar svg { width: 14px; height: 14px; fill: currentColor; display: block; }
.mbar b { font-weight: 700; }
.mbar .r { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.dfiles { position: absolute; z-index: 1; top: 44px; right: 6px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.dfile { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: default; border-radius: 6px; padding: 4px 2px; }
.dfile .th { width: 64px; height: 56px; display: grid; place-items: center; }
.dfile .th img { max-width: 64px; max-height: 56px; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.35); }
.dfile .th svg { width: 56px; height: 56px; }
.dfile span { max-width: 92px; font-size: 11.5px; line-height: 1.25; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.7); overflow-wrap: anywhere; padding: 1px 4px; border-radius: 4px; }
.dfile.sel span { background: #2c64d8; text-shadow: none; }
.dfile.sel .th { background: rgba(255,255,255,.18); border-radius: 6px; }
.win { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.45), 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12) inset; }
.win[hidden] { display: none; }
.lights { position: absolute; z-index: 3; left: 14px; top: 11px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); cursor: pointer; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; cursor: default; }
.tw { z-index: 4; left: 60px; top: 96px; width: 580px; height: 340px; background: rgba(30,30,32,.94); color: #e8e8e8; }
.tw .tb { height: 32px; display: grid; place-items: center; font-size: 12.5px; color: #a6a6a6; border-bottom: 1px solid rgba(255,255,255,.08); }
.tw pre { margin: 0; padding: 10px 16px; font: 12.5px/1.65 "JetBrains Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; font-variant-ligatures: none; }
.tw .p { color: #7fd08c; } .tw .o { color: #b4b4b4; } .tw .c { display: inline-block; width: 8px; height: 15px; vertical-align: -3px; background: #e8e8e8; animation: blink 1.05s steps(1) infinite; }
.aw { z-index: 5; left: 20px; top: 40px; width: 900px; height: 700px; background: #EFEFED; }
:root[data-theme="dark"] .aw { background: #0A0A0A; }
.aw .lights { top: 16px; left: 12px; gap: 6px; }
.aw .lights i { width: 10px; height: 10px; }
.aw iframe { position: absolute; left: 0; top: 0; width: 1125px; height: 875px; transform: scale(.8); transform-origin: 0 0; border: 0; display: block; background: transparent; }
.aw .boot { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: inherit; transition: opacity .5s; }
.aw .boot img { width: 84px; height: 84px; animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.92); opacity: .7; } }
.aw .boot.gone { opacity: 0; pointer-events: none; }
.ddock { position: absolute; z-index: 40; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 8px; padding: 7px 9px; border-radius: 22px; background: rgba(255,255,255,.26); -webkit-backdrop-filter: blur(26px) saturate(1.7); backdrop-filter: blur(26px) saturate(1.7); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55), 0 12px 34px rgba(0,0,0,.28); }
.ddock .sep { width: 1px; height: 46px; background: rgba(255,255,255,.4); margin: 0 3px 3px; }
.ddock .ic { position: relative; width: 54px; height: 54px; cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.ddock .ic:hover { transform: translateY(-6px) scale(1.12); }
.ddock .ic img, .ddock .ic svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.25)); }
.ddock .ic.run::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(20,20,20,.75); }
:root[data-theme="dark"] .ddock .ic.run::after { background: rgba(255,255,255,.85); }
.ddock .ic.bounce { animation: bounce .7s cubic-bezier(.3,0,.3,1) 2; }
@keyframes bounce { 40% { transform: translateY(-16px); } }
.ddock .ic .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); padding: 3px 10px; border-radius: 6px; background: rgba(40,40,40,.85); color: #fff; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.ddock .ic:hover .tip { opacity: 1; }
.ql { position: absolute; z-index: 45; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.18); }
.ql[hidden] { display: none; }
.ql .card { max-width: 820px; padding: 34px 12px 12px; border-radius: 14px; background: rgba(236,236,236,.88); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); box-shadow: 0 30px 90px rgba(0,0,0,.5); position: relative; }
.ql .card b { position: absolute; top: 9px; left: 0; right: 0; text-align: center; font-size: 12.5px; font-weight: 600; color: #333; }
.ql .card .x { position: absolute; top: 8px; left: 12px; width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; border: 0; cursor: pointer; }
.ql .card img { display: block; max-width: 796px; max-height: 560px; }
.dcur { position: absolute; z-index: 60; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none; opacity: 0; transition: opacity .3s; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.dcur.on { opacity: 1; }
.dstep { margin-left: auto; min-width: 0; font-size: 12.5px; font-weight: 400; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dstep b { font-weight: 500; color: var(--faint); margin-right: 7px; font-variant-numeric: tabular-nums; }
.dstep + .again { margin-left: 0; }

.deskshot { display: none; }
/* 安装：一条大的（命令、那段话、workflow 文件或下载按钮），旁边写明「复制」；下面一排字是别的装法，点了就换上去 */
.uget { position: relative; margin-top: 18px; }
.ufield { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 8px 8px 22px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.ufield .ut { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 14px "JetBrains Mono", monospace; color: var(--ink); }
.ufield .ut i { font-style: normal; color: var(--faint); margin-right: 12px; }
.ufield .ut.say { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font: 14px/1.6 Inter, sans-serif; color: var(--soft); }
.ufield .fi { flex: none; width: 18px; height: 18px; margin-right: -4px; color: var(--faint); }
.ucopy { flex: none; height: 48px; padding: 0 20px 0 17px; border-radius: 12px; border: 0; background: var(--ink); color: var(--bg); font: 500 14px Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none; white-space: nowrap; transition: transform .2s, opacity .2s; }
.ucopy:hover { transform: translateY(-1px); }
.ucopy svg { width: 16px; height: 16px; }
a.ucopy svg { fill: currentColor; }
.ufield.dl { padding: 0; background: none; box-shadow: none; }
.ufield.dl .ucopy { flex: 1; height: 64px; border-radius: 16px; font-size: 15.5px; }
.ufield.dl .ucopy svg { width: 18px; height: 18px; }
.unq { margin-top: 14px; display: grid; gap: 8px; }
.unq p { margin: 0; padding-left: 8px; font-size: 13px; color: var(--soft); }
.ufield.sm { min-height: 48px; padding: 6px 6px 6px 18px; border-radius: 13px; background: transparent; }
.ufield.sm .ut { font-size: 12.5px; color: var(--soft); }
.ufield.sm .ucopy { height: 36px; padding: 0 13px 0 11px; border-radius: 9px; font-size: 13px; background: var(--line2); color: var(--ink); }
.uopts { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 2px; margin-top: 12px; padding-left: 8px; font-size: 13px; }
.uopts .ul { color: var(--faint); margin-right: 8px; }
.uopts button { height: 30px; padding: 0 10px; border: 0; border-radius: 99px; background: transparent; color: var(--soft); font: 13px Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; transition: color .15s, background-color .15s; }
.uopts button:hover { color: var(--ink); background: var(--line2); }
.uopts button.on { color: var(--ink); background: var(--line2); font-weight: 500; }
.uopts button svg { width: 14px; height: 14px; transition: rotate .2s; }
.uopts button[aria-expanded="true"] { color: var(--ink); background: var(--line2); }
.uopts button[aria-expanded="true"] svg { rotate: 180deg; }
.uopts .uh { margin-left: auto; padding-left: 12px; color: var(--faint); font-size: 12.5px; }

  if (w.id === 'app' && o.os === 'mac') field += `<div class="unq"><p>${en ? 'The app isn’t signed by Apple yet, so macOS may say it’s damaged. Once it’s in Applications, run this once:' : 'App 还没有 Apple 签名，macOS 可能提示「已损坏，无法打开」。拖进「应用程序」后，在终端运行一次：'}</p><div class="ufield sm"><code class="ut"><i>$</i>${UNQ}</code><button class="ucopy" data-copy="${UNQ}">${COPY_SVG}${COPY_L()}</button></div></div>`;
  const inl = w.opts.map((x, j) => j).filter((j) => fits(w.opts[j])).slice(0, 6);
  if (!inl.includes(at)) inl.push(at);
  const more = w.opts.length > inl.length;
  $('uget').innerHTML = field + `<div class="uopts"><span class="ul">${OPT_L[w.id][en ? 1 : 0]}</span>`
    + inl.map((j) => `<button data-j="${j}" class="${j === at ? 'on' : ''}">${esc(w.opts[j].k)}</button>`).join('')
    + (more ? `<button class="umore" aria-expanded="false" aria-haspopup="true">${en ? 'More' : '更多'}${CHEV}</button>` : '')
    + `<span class="uh">${esc(uHint(w, o))}</span></div>`;
  // 首屏第二个按钮：下载本机的 App（手机上没有 App，去看四种用法）
  const me = detectOS();
  const hero = MOBILE ? [DL_SVG, en ? 'Install' : '安装'] : [ICON(me === 'mac' ? 'apple' : me === 'win' ? 'windows' : 'linux'), en ? `Get it for ${OSN[me]}` : `下载 ${OSN[me]} 版`];
  $('herodl').innerHTML = hero[0] + hero[1]; $('herodl').setAttribute('href', '#use');
}
// 「更多」：这一种用法的全部装法，点一个就换上去
const closePop = () => document.querySelectorAll('.wpop').forEach((x) => { document.querySelector('.umore')?.setAttribute('aria-expanded', 'false'); x.remove(); });
document.addEventListener('click', (e) => {
  const item = e.target.closest('.uopts button[data-j], .wpop button'), more = e.target.closest('.umore');
  if (item) { picks[USE.cur] = +item.dataset.j; closePop(); install(); return; }
  if (!more) { if (!e.target.closest('.wpop')) closePop(); return; }
  const open = more.getAttribute('aria-expanded') === 'true';
  closePop(); if (open) return;
  const w = ways().find((x) => x.id === USE.cur), en = lang() === 'en';
  const cur = picks[w.id] ?? -1, pop = document.createElement('div');
  pop.className = 'wpop'; pop.setAttribute('role', 'menu');
  pop.innerHTML = w.opts.map((o, j) => `${o.g ? `<div class="g">${o.g}</div>` : ''}<button role="menuitem" data-j="${j}" class="${j === cur ? 'on' : ''}"${o.tip ? ` title="${o.tip}"` : ''}><b>${esc(o.k)}</b><span>${esc(o.kind === 'dl' ? o.file : o.kind === 'say' ? o.text.split('\n')[0] : o.kind === 'yaml' ? o.file : o.text)}</span></button>`).join('')
    + `<div class="ver">${en ? `Current <code>v${VER}</code> · nightly: <code>creditia@next</code>, <code>@main</code>` : `当前 <code>v${VER}</code> · 预览版 <code>creditia@next</code>、<code>@main</code>`}</div>`;
  $('uget').append(pop); more.setAttribute('aria-expanded', 'true');
  pop.style.left = `${Math.max(0, Math.min(more.offsetLeft - 6, $('uget').clientWidth - pop.offsetWidth))}px`;
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });
// 左边挑一种：右边换成它的演示，没演过的现在演；底下换成它的安装
const SUB = { cli: '~/your-repo', agent: 'Claude Code · Codex · Cursor · Gemini CLI …', ci: 'WroughtMind/creditia@main', app: 'macOS · Windows · Linux' };
function pickWay(id, focus) {
  USE.cur = id; closePop();
  $('upick').querySelectorAll('button').forEach((b) => { const on = b.dataset.w === id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
  document.querySelectorAll('.upane').forEach((p) => p.classList.toggle('on', p.dataset.w === id));
  document.querySelectorAll('.ubar .again').forEach((b) => (b.hidden = b.dataset.again !== PLAY_OF[id]));
  $('dsteps').hidden = id !== 'app';
  $('usub').textContent = PHONE ? t(`w.${id}.d`) : SUB[id];
  if (id === 'app') deskScale();
  install();
  if (USE.vis) playCur();
}
$('upick').addEventListener('click', (e) => { const b = e.target.closest('button[data-w]'); if (b && b.dataset.w !== USE.cur) pickWay(b.dataset.w); });
$('upick').addEventListener('keydown', (e) => {
  const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key]; if (!d) return;
  e.preventDefault(); const ids = Object.keys(PLAY_OF); pickWay(ids[(ids.indexOf(USE.cur) + d + ids.length) % ids.length], true);
});
// 首屏的下载按钮：换到 App，滚过来，下载按钮亮一下
$('herodl').addEventListener('click', (e) => {
  e.preventDefault(); pickWay('app');
  document.querySelector('.uses').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' });
  const g = $('uget'); g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash');
});

// ───────── 顶栏：离开首屏后变实底；往下滚收起，往上滚出现；当前在哪一节，药丸就滑到哪 ─────────
const hdr = document.querySelector('header');
let hy = scrollY;
addEventListener('scroll', () => {
  const y = scrollY, past = Z.on ? zp() > 0.55 : y > screenEl.offsetHeight - 120;
  hdr.classList.toggle('solid', past);
  if (Math.abs(y - hy) > 6) { hdr.classList.toggle('away', past && y > hy && y > screenEl.offsetHeight + 200 && lb.hidden); hy = y; }
}, { passive: true });
const navPill = document.querySelector('nav .pill');
const navTo = (id) => {
  const a = document.querySelector(`nav a[href="#${id}"]`);
  document.querySelectorAll('nav a').forEach((x) => x.classList.toggle('on', x === a));
  if (a) { navPill.style.left = `${a.offsetLeft}px`; navPill.style.width = `${a.offsetWidth}px`; navPill.style.opacity = 1; } else navPill.style.opacity = 0;
};
// 视口 40% 高度那条线落在哪一节，就是当前节
const SECS = ['lines', 'looks', 'use'];
let curSec;
const spy = () => { let id = null; for (const k of SECS) if ((Z.on && k === 'lines' ? (zp() >= 0.5 ? 0 : 1e9) : $(k).getBoundingClientRect().top + (Z.on && k === 'looks' ? innerHeight * 0.5 : 0)) < innerHeight * 0.4) id = k; if (id !== curSec) { curSec = id; navTo(id); } };
addEventListener('scroll', spy, { passive: true });
addEventListener('resize', () => { curSec = undefined; spy(); });

// ───────── 出场：滚到哪，哪里的标题一个字一个字升起来 ─────────
const io = new IntersectionObserver((es) => {
  let k = 0;
  es.forEach((x) => {
    if (!x.isIntersecting) return;
    const el = x.target; io.unobserve(el);
    if (Z.on && el.closest('#lines')) return; // 舞台里的由镜头推进来出场
    el.style.transitionDelay = `${k++ * 90}ms`;
    el.classList.add('in');
    const h2 = el.querySelector('h2');
    if (h2 && !RM) rise(split(h2), { step: lang() === 'zh' ? 40 : 70, dur: 1000 });
    if (el.classList.contains('editor')) setTimeout(scan, 300);
  });
}, { rootMargin: '0px 0px -10% 0px' });

// ───────── 语言、主题、复制 ─────────
function applyLang() {
  document.querySelectorAll('[data-i]').forEach((el) => (el.innerHTML = t(el.dataset.i)));
  // 像脚注一样：点标题后面的 *，跳到「出处」
  const h1 = document.querySelector('.title h1'), ast = document.createElement('a');
  ast.className = 'ast'; ast.href = '#lines'; ast.setAttribute('aria-label', t('nav.lines')); ast.innerHTML = MARK; h1.append(ast);
  if (heroMark) heroMark = liveMark(ast.querySelector('svg'), { delay: 250, breathe: true });
  // 有英文版的文档：链接跟着语言换
  // App 截图：英文页放英文界面的
  document.querySelectorAll('.deskshot img').forEach((im) => { im.src = `assets/app-${im.classList.contains('dk') ? 'dark' : 'light'}${lang() === 'en' ? '-en' : ''}.webp`; });
  document.querySelectorAll('[data-en-href]').forEach((a) => { a.dataset.zhHref ??= a.getAttribute('href'); a.setAttribute('href', lang() === 'en' ? a.dataset.enHref : a.dataset.zhHref); });
  $('lang').textContent = lang() === 'en' ? '中' : 'EN';
  document.title = lang() === 'en' ? 'creditia — which AI wrote your code' : 'creditia — 你的代码，是哪些 AI 写的';
  field(); lines(); usage(); pickWay(USE.cur); zoomSetup(); table();
}
// 换语言：整页淡入淡出；换主题：从按钮那里一圈扩开
const transition = (fn, circleFrom) => {
  if (!document.startViewTransition || RM) return fn();
  const root = document.documentElement;
  if (circleFrom) root.classList.add('vt-theme');
  const vt = document.startViewTransition(fn);
  if (circleFrom) {
    const r = circleFrom.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const R = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
    vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${cx}px ${cy}px)`, `circle(${R}px at ${cx}px ${cy}px)`] }, { duration: 750, easing: 'cubic-bezier(.65,0,.25,1)', pseudoElement: '::view-transition-new(root)' }));
  }
  vt.finished.finally(() => root.classList.remove('vt-theme'));
};
$('lang').onclick = () => transition(() => {
  document.documentElement.lang = lang() === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('ct-lang', document.documentElement.lang); } catch (e) {}
  applyLang(); split(document.querySelector('.title h1'));
});
const onTheme = () => {};
$('theme').onclick = (e) => {
  const b = e.currentTarget;
  transition(() => {
    document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('ct-theme', document.documentElement.dataset.theme); } catch (err) {}
    onTheme();
  }, b);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) onTheme(); });
$('copy').dataset.copy = 'npx creditia analyze';
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { field(); zoomSetup(); if (innerWidth !== TB.w) { TB.w = innerWidth; table(); } else tableSetup(); }, 200); });
applyLang();
intro();
document.fonts?.ready.then(() => Z.on && zoomSetup()); // 字体到了再量一次词的位置
document.querySelectorAll('.rise').forEach((el) => io.observe(el));
</script>
</body>
</html>

[package]
name = "creditia-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "creditia 的轻量查看与导出中心"

# 独立 workspace，不并入仓库根目录的 workspace
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
creditia-store = { path = "../../../crates/store" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 设置里换标志：程序坞图标用 AppKit 换
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[profile.release]
strip = true
lto = "thin"

[package]
name = "creditia-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "creditia 的轻量查看与导出中心"

# 独立 workspace，不并入仓库根目录的 workspace
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
creditia-store = { path = "../../../crates/store" }

[profile.release]
strip = true
lto = "thin"

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>creditia</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header id="top" data-tauri-drag-region>
  <div class="brand" data-tauri-drag-region><span class="logo" id="logo"></span><span class="word">creditia</span></div>
  <div class="pill glass" id="project" role="button" tabindex="0" aria-haspopup="listbox">
    <span class="pname" id="pname">…</span><span class="pmeta" id="pmeta"></span>
    <svg class="chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </div>
  <div class="seg glass" id="group" role="group" hidden></div>
  <div class="tools">
    <div class="seg glass" id="view" role="group"><button data-v="wall">墙</button><button data-v="roam">漫游</button></div>
    <button class="round glass" id="lang" title="中文 / English">中</button>
    <button class="round glass" id="gear" title="设置" aria-label="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>
<div id="menu" class="menu glass" hidden></div>

<main id="stage"><section id="plug" class="glass" hidden></section><div id="board"></div><div id="empty" hidden></div></main>
<div id="roam" hidden><div class="plane"></div></div>
<button class="glass" id="home" hidden></button>

<nav id="dots" class="glass" aria-label="风格"></nav>
<div id="dock" class="glass">
  <div class="hint" id="hint">拖动作品到这里导出</div>
  <div class="targets" id="targets"></div>
  <div class="sizes" id="sizes"></div>
</div>

<div id="focus" hidden></div>
<div id="sheet" hidden></div>
<div id="ghost" hidden></div>
<div id="toast" class="glass" hidden></div>
<div id="tipname" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>creditia</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header id="top" data-tauri-drag-region>
  <div class="pill" id="project" role="button" tabindex="0" aria-haspopup="listbox">
    <span class="pname" id="pname">creditia</span>
    <svg class="chev" width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.5 4.5 4 2l2.5 2.5M1.5 7.5 4 10l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="tools glass" id="tools">
    <div class="seg" id="group" role="group" hidden></div><i class="sep" aria-hidden="true"></i>
    <div class="seg" id="view" role="group"><button data-v="wall"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="7" rx="1.2"/><rect x="9" y="2" width="5" height="4" rx="1.2"/><rect x="2" y="11" width="5" height="3" rx="1.2"/><rect x="9" y="8" width="5" height="6" rx="1.2"/></svg></button><button data-v="roam"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v12.4M1.8 8h12.4M6.2 3.6 8 1.8l1.8 1.8M6.2 12.4 8 14.2l1.8-1.8M3.6 6.2 1.8 8l1.8 1.8M12.4 6.2 14.2 8l-1.8 1.8"/></svg></button></div><i class="sep" aria-hidden="true"></i>
    <button class="round" id="lang">中</button>
    <button class="round" id="gear"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>
<div id="menu" class="menu glass" hidden></div>

<main id="stage"><div id="board"></div><div id="empty" hidden></div></main>
<section id="welcome" hidden></section>
<div id="roam" hidden><div class="plane"></div></div>
<button class="glass" id="home" hidden></button>

<nav id="dots" class="glass" aria-label="风格"></nav>
<div id="dock" class="glass">
  <div class="hint" id="hint"></div>
  <div class="targets" id="targets"></div>
  <div class="sizes" id="sizes"></div>
</div>

<div id="focus" hidden></div>
<div id="sheet" hidden></div>
<div id="ghost" hidden></div>
<div id="toast" class="glass" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

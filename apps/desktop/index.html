<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>creditia</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<!-- 图标由 icons.ts 在启动时填进 [data-icon] -->
<header id="top" data-tauri-drag-region>
  <div class="project-status">
    <div class="pill" id="project" role="button" tabindex="0" aria-haspopup="listbox">
      <span class="pmark" id="pmark"></span>
      <span class="pname" id="pname">creditia</span>
      <span class="chev" data-icon="updown"></span>
    </div>
    <span class="pstat" id="pstat" aria-live="polite"><span class="in"></span></span>
  </div>
  <div class="tools glass" id="tools">
    <div class="seg" id="group" role="group" hidden></div><i class="sep" aria-hidden="true"></i>
    <div class="seg" id="view" role="group"><button data-v="wall" data-icon="wall"></button><button data-v="roam" data-icon="roam"></button></div><i class="sep" aria-hidden="true"></i>
    <button class="round" id="export-tasks" aria-controls="exports" aria-expanded="false" aria-live="polite" hidden></button>
    <button class="round" id="gear" data-icon="gear"></button>
  </div>
</header>
<div id="menu" class="menu glass" hidden></div>

<main id="stage"><div id="board"></div><div id="empty" hidden></div></main>
<div id="center" hidden><div class="box"><span class="mslot"></span><p class="lbl" aria-live="polite"></p></div></div>
<section id="welcome" hidden></section>
<div id="roam" hidden><div class="plane"></div></div>
<button class="glass" id="home" hidden></button>

<nav id="dots" class="glass" aria-label="风格"></nav>
<div id="dock" class="glass">
  <div class="hint" id="hint"></div>
  <div class="targets" id="targets"></div>
  <div class="sizes" id="sizes"></div>
</div>

<div id="focus" hidden></div>
<div id="sheet" hidden></div>
<div id="ghost" hidden></div>
<div id="toast" class="glass" hidden></div>
<div id="exports" class="glass" role="status" aria-live="polite" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

[package]
name = "creditia-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

# Keep the native UI toolchain separate from the analysis/CLI workspace.
[workspace]

[dependencies]
gpui-kit = "=0.9.0"
creditia-desktop-service = { path = "../../crates/desktop-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
base64 = "0.22"
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }

[features]
visual-test = ["gpui-kit/test-support"]

[[test]]
name = "rendering"
harness = false
test = false
required-features = ["visual-test"]

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 4

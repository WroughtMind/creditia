[package]
name = "creditia-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

# Keep the native UI toolchain separate from the analysis/CLI workspace.
[workspace]

[dependencies]
gpui-kit = "=0.9.0"
creditia-desktop-service = { path = "../../crates/desktop-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
base64 = "0.22"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 4
